# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How systems are required to communicate with each other.
# Conflicts: one ADR expects signal, another expects direct call = integration bug.
#
# Register a contract when the communication pattern between two systems is
# explicitly decided in an ADR and other systems must follow the same pattern.
#
# pattern options: signal | direct_call | event_bus | shared_resource | rpc | none

interfaces:
  - contract: query_result_versioning
    status: active
    pattern: shared_resource
    producer: tactical-combat-system
    consumers:
      - battle-hud                # renders overlays; must check is_stale() before accepting input
      - affinity-position-linkage # reads adjacency/placement queries (system #5, Not Started)
    adr: docs/architecture/adr-0001-tactical-query-atomicity-contract.md
    signal_signature: "QueryResult.version: int + QueryResult.is_stale(board: Board) -> bool"
    notes: >
      EVERY outbound query of tactical-combat-system returns a result carrying the
      board_version it was computed against. Consumers must not accept player input
      based on a result whose is_stale() is true. Result containers are always newly
      allocated — never references into Board's internal storage.
    referenced_by:
      - docs/architecture/adr-0001-tactical-query-atomicity-contract.md
    added: 2026-08-18
    revised: ""

  - contract: composite_query_consistency
    status: active
    pattern: shared_resource
    producer: tactical-combat-system
    consumers:
      - battle-hud
    adr: docs/architecture/adr-0001-tactical-query-atomicity-contract.md
    signal_signature: "QueryResult.assert_same_version(results: Array[QueryResult]) -> bool"
    notes: >
      Any set of query outputs merged into ONE picture for the player — the co-visible
      movement-range and threat-range overlays required by tactical-combat-system.md
      UI §1a, and threat_range_all(E)'s N-enemy union — counts as a single query and
      must share one board_version. Stitching results from different versions produces
      a picture corresponding to no real board state.
    referenced_by:
      - docs/architecture/adr-0001-tactical-query-atomicity-contract.md
    added: 2026-08-18
    revised: ""

  - contract: affinity_death_notification
    status: active
    pattern: direct_call
    producer: tactical-combat-system    # caller — reverse Foundation←Gameplay dependency
    consumers:
      - affinity-data-pool
    adr: docs/architecture/adr-0002-affinity-data-pool-data-structure-and-concurrency-contract.md
    signal_signature: "AffinityDataPool.notify_death(character: AffinityTypes.Character) -> DeathNotifyResult"
    notes: >
      A single synchronous, unbuffered, unqueued method call. tactical-combat-system's
      death-settlement flow must call this directly — NOT relayed through
      affinity-position-linkage, which would create a Foundation↔Gameplay cycle (see
      systems-index.md dependency graph). The relative call order between this and
      affinity-data-pool's append_record() within the same settlement step determines
      write legality (affinity-data-pool.md Core Rules #2) — tactical-combat-system's
      death-settlement design must pin down and document that order; affinity-data-pool
      does not arbitrate it.
    referenced_by:
      - docs/architecture/adr-0002-affinity-data-pool-data-structure-and-concurrency-contract.md
    added: 2026-08-18
    revised: ""

  - contract: affinity_serialization_lifecycle
    status: active
    pattern: direct_call
    producer: affinity-data-pool
    consumers:
      - save-system
    adr: docs/architecture/adr-0002-affinity-data-pool-data-structure-and-concurrency-contract.md
    signal_signature: "AffinityDataPool.begin_non_atomic_window() -> int / end_non_atomic_window(token: int) -> EndTokenResult"
    notes: >
      Token-based, NOT a boolean flag — supports multiple concurrent non-atomic windows
      (save-system's per-slot parallel operations, see save-system.md Core Rules #2/AC-59).
      save-system must call begin_non_atomic_window() before any window during which
      affinity-data-pool data is not fully written/restored, and end_non_atomic_window()
      with the SAME token when that window closes on every exit path (success, failure,
      and abort) — see affinity-data-pool.md Core Rules #6 for the three termination
      paths. Distinct in mechanism from tactical-combat-system's settlement_in_progress
      (single boolean reject-gate) despite similar reject-style intent — do not conflate
      the two patterns when designing future lifecycle-gated state.
    referenced_by:
      - docs/architecture/adr-0002-affinity-data-pool-data-structure-and-concurrency-contract.md
    added: 2026-08-18
    revised: ""

  - contract: save_block_validator_registration
    status: active
    pattern: direct_call
    producer: "each data-owning system (e.g. affinity-data-pool)"
    consumers:
      - save-system
    adr: docs/architecture/adr-0003-save-system-serialization-format-and-type-safety.md
    signal_signature: "SaveBlockRegistry.register(source_id: String, validator: Callable) — validator: Callable(Dictionary) -> ImportResult, pure, no state mutation"
    notes: >
      Every persisted data block's owning system MUST expose a pure validate_semantics()
      function and register it against its source_id at startup, before any save read can
      occur. If a manifest lists a block with no registered validator, save-system treats
      this as DATA_CORRUPTED (fail-closed, per save-system.md Core Rules #7) — the block's
      own hash/type-safety checks passing is not sufficient. affinity-data-pool.md
      satisfies this via AffinityDataPool.validate_semantics() (added retroactively to
      ADR-0002 per this ADR). Future data-owning systems (chapter/campaign structure,
      living-board terrain evolution, etc.) must do the same when designed.
    referenced_by:
      - docs/architecture/adr-0002-affinity-data-pool-data-structure-and-concurrency-contract.md
      - docs/architecture/adr-0003-save-system-serialization-format-and-type-safety.md
    added: 2026-08-18
    revised: ""

  - contract: save_io_backend_abstraction
    status: active
    pattern: shared_resource
    producer: save-system
    consumers:
      - save-system   # internal — AtomicReplace/SteppedMigration/etc. all consume via this boundary, not FileAccess/DirAccess directly
    adr: docs/architecture/adr-0004-save-system-atomic-write-and-migration-execution-model.md
    signal_signature: "SaveIOBackend (@abstract): write_temp/rename_file/delete_file/file_exists/read_file. SyncBlockingSaveIOBackend extends SaveIOBackend is the current concrete implementation."
    notes: >
      All save-system disk access goes through this abstraction, never directly through
      FileAccess/DirAccess in higher-level logic (atomic-replace sequence, stepped
      migration, token consumption). This exists specifically because save-system.md
      Open Question 9 (whether Core Rules #4's sync-blocking model holds on the confirmed
      console target platform) is unresolved pending unspecified console SDK details — a
      future AsyncSaveIOBackend can be substituted without rewriting the atomic-replace
      sequence, migration state machine, or lifecycle-token consumption logic, which only
      depend on "each step's success can be checked," not on synchronicity itself.
    referenced_by:
      - docs/architecture/adr-0004-save-system-atomic-write-and-migration-execution-model.md
    added: 2026-08-18
    revised: ""


  - contract: cursor_target_write
    status: active
    pattern: method_call
    producer: cursor-highlight-state
    consumers:
      - tactical-combat-system    # sets initial target (Core Rules #6); marks stale on unit death/move
      - save-system               # handoff branches 甲/乙/丙 across screen teardown (ADR-0004 read path)
    adr: docs/architecture/adr-0005-cursor-device-authority-input-architecture.md
    signal_signature: "PUBLIC GATED ENTRIES (7): arbitrate_device_authority(events: Array[InputEvent]) -> void  |  apply_buffered_navigation(events: Array[InputEvent]) -> void  |  set_target(target: CursorTarget, from_ui_action: bool) -> SetTargetResult  |  mark_pending_reresolve(expected: CursorTarget) -> MarkResult  |  handoff_before_unload() -> MarkResult  |  handoff_after_mount(target: CursorTarget) -> SetTargetResult  |  reseed_reclaim_on_focus_regained() -> void  ||  PRIVATE UNGATED (6): _write_target_internal(target, reset_policy) -> void  |  _mark_pending_reresolve_internal(expected) -> MarkResult  |  _validate_target_writable(target) -> SetTargetResult  |  _safe_mouse_position() -> Vector2  |  _target_changed_from(old, new) -> bool  |  _drain_pending_reseed() -> void  ||  CTOR: _init(reclaim, registry, mouse_position_provider: Callable)"
    notes: >
      mark_pending_reresolve MUST NEVER be silent: if `expected` does not equal the
      currently-held target (the player navigated away in the meantime), it returns
      STALE_NOT_APPLIED and the player's valid target is left untouched. Callers must not
      assume "called once == problem solved" — they must re-detect and retry.
      These ACTIVE write calls are NOT gated by the arbitration-suspended flag: save-load
      branches 甲 (mark before old surface teardown) and 丙 (set new target before
      returning) can legitimately fire while a pause menu is still on screen. Only the
      PASSIVE arbitration path is suspended. Branch 丙 RECOMPUTES a target per Core Rules
      #6 ONLY WHEN THE ORIGINAL TARGET IS NO LONGER VALID — CORRECTED 2026-08-19b (round-4,
      TR-cursor-015 gap b). AC-63b's actual wording is conditional: "if the original target
      is still valid after the cancellation (surface not torn down, the entity it points to
      still exists), it MAY be re-set directly to the original value, no recomputation
      needed; only when the original target has become invalid is Core Rules #6 used."
      ADR-0005's previous unconditional "recompute" NARROWED a GDD obligation, which breaks
      its own Ordering Note constraint. Validity determination belongs to the CALLER (this
      system does not understand game-entity semantics). What is NOT optional: the caller
      must actively re-set something — the cursor must never return to an interactive screen
      still in the pending-reresolve state.
      All three handoff branches pass from_ui_action = false: device authority never
      shifts on a system-initiated retarget.
      ADDED 2026-08-19b (round-4, TR-cursor-015 gap a): branches 甲 and 乙 must ALSO reset
      the mouse-reclaim accumulator to 0 and re-seed it at the current mouse position, via
      _reclaim.reset(pos, ResetTrigger.SURFACE_HANDOFF). GDD Core Rules #7 F2-2 states this
      explicitly and ADR-0005 was silent on it through two revisions. SURFACE_HANDOFF is a
      FIFTH ResetTrigger value sourced from Core Rules #7, NOT a fifth trigger point of Core
      Rules #3 (which has exactly four) — branch 甲 does not change the target, so reusing
      TARGET_CHANGED would lie to the presentation layer. Presentation treatment is the same
      as (a)/(b)/(c): converge, never snap.
      REVISED 2026-08-19 (ADR-0005 fix N4): both SetTargetResult and MarkResult gained a
      REJECTED_REENTRANT value. Mutating calls are guarded by an internal
      _mutation_in_progress flag — a call made reentrantly from within a handler of this
      system's own target_changed()/device_authority_changed() signals (see interface
      contract cursor_state_change_signals) is rejected with REJECTED_REENTRANT rather than
      mutating state or re-emitting. Callers needing to chain a write from inside a signal
      handler must use call_deferred() instead of calling synchronously.
      REVISED 2026-08-19b (ADR-0005 round-4 fixes R4-1, R4-4, and new finding B):
      (1) arbitrate_frame() NO LONGER EXISTS. It is split into arbitrate_device_authority()
      (GDD step 1, priority -100) and apply_buffered_navigation() (GDD step 3, priority -25
      on the CursorNavigationApplier child node) — see api decision
      cursor_actor_process_priority_ladder. FIVE public entries are now gated, not four.
      (2) The two void-returning entries CANNOT return REJECTED_REENTRANT; their gate
      semantics are "no-op, no field write, no signal", plus an increment of a QA-only
      diagnostic_reentrant_rejection_count so a reentrant hit is visible in tests rather
      than fully silent. The three value-returning entries are unchanged.
      (3) THE GATE MUST NOT BE APPLIED TO INTERNAL WRITES. All actual mutation of _target
      goes through a PRIVATE _write_target_internal(), which does NOT check the flag — if
      apply_buffered_navigation() reused the public set_target() it would be rejected by its
      own gate and the buffered navigation write would never take effect (round-4 R4-4).
      Public entries must never call one another; see forbidden pattern
      public_cursor_write_entry_calling_another.
      (4) CursorState._init() gained a THIRD parameter, mouse_position_provider: Callable.
      F2 changed evaluate() to take the current mouse position, but CursorState is a
      RefCounted with no scene tree and therefore had no way to obtain it — the arbitration
      path and the handoff path were both left dangling. Both now use this one channel.
      REVISED 2026-08-19c (round-5 R5-1, BLOCKING, plus three Step-5.5 findings):
      (1) SEVEN public entries are now gated, not five. Added handoff_after_mount(target)
      -> SetTargetResult (branch 乙, R5-1) and reseed_reclaim_on_focus_regained() -> void
      (R5-3). Round 5 proved branch 乙 had NO LEGAL CALL PATH to emit SURFACE_HANDOFF: it
      reused the generic set_target(), whose path is "reset only if the target actually
      changed, with TARGET_CHANGED". All three readings failed (caller touching the private
      _reclaim; set_target() distinguishing the branch from from_ui_action, which is false
      for both 乙 and 丙; set_target() emitting SURFACE_HANDOFF unconditionally, which would
      misfire on 丙 and on ordinary retargets), and a fourth problem existed: if 乙's
      computed target equals the current one, no reset fired at all — the GDD-mandated
      zeroing silently did not happen.
      (2) 2026-08-21: SIX private paths, not four (and not one). _target_changed_from(old, new)
      and _drain_pending_reseed() were added by the fourth revision — R6-7's and R6-10's fixes each
      need a shared private method, and copying the logic into each public entry is exactly what
      R5-1 forbade. Step 5.5 flagged this as a count that NECESSARILY changes; at least 7 places
      declared "four". Note the ADR's own mechanism-10 comment said "three" even before this
      revision — inconsistent with the "four" table since the third revision. The six are:
      _write_target_internal(target, reset_policy),
      _mark_pending_reresolve_internal(expected), _validate_target_writable(target),
      _safe_mouse_position(). The second closes a defect of the SAME SHAPE as R4-4 that
      round 4 left unfixed: handoff_before_unload() (branch 甲) was specified as "calls
      mark_pending_reresolve()", but both are gated public entries — 甲 would be rejected by
      its own gate. The third closes the "handoff_after_mount() has nowhere to put its
      validation" gap (godot-specialist ranked it the most likely next R5-x).
      (3) The reset policy is an ENUM (TargetResetPolicy { CONDITIONAL_ON_CHANGE,
      UNCONDITIONAL }), deliberately NOT a bool: GDScript has no call-site named arguments,
      so _write_target_internal(t, true) is unreadable at the call site — the same boolean
      trap this ADR had just rejected at the public level.
      (4) The two reset paths inside _write_target_internal() MUST be if/elif, never two
      independent ifs — see forbidden pattern independent_ifs_for_cursor_target_reset_policy.
    added: 2026-08-18
    revised: "2026-08-19c"

  - contract: cursor_surface_registration
    status: active
    pattern: method_call
    producer: cursor-highlight-state
    consumers:
      - tactical-combat-system    # BOARD_TILE
      - affinity-visual-ui        # RELATION_MINIMAP_NODE (system #9, Not Started)
      - battle-hud                # CARD_SLOT (system #10, Not Started)
      - support-conversation-ui   # DIALOGUE_CHOICE (system #11, Not Started)
    adr: docs/architecture/adr-0005-cursor-device-authority-input-architecture.md
    signal_signature: "register(surface: CursorTypes.SurfaceType, node: Node) -> RegisterResult  |  unregister(surface) -> RegisterResult  |  get_surface(surface) -> Node|null  |  registered_surfaces_sorted() -> Array[CursorTypes.SurfaceType]"
    notes: >
      ONE mounted instance per tag at any instant: register() on an occupied tag returns
      DUPLICATE_TAG_REJECTED and does NOT overwrite — fail-loud, matching ADR-0002's
      DUPLICATE_DEATH_NOTIFICATION idempotency convention.
      Any traversal of registered surfaces MUST go through registered_surfaces_sorted()
      (ordered by the enum's underlying int), never by iterating the internal Dictionary —
      see forbidden pattern relying_on_container_iteration_order (ADR-0001).
      Registration also carries the mechanism-14 obligation: every registered surface's
      root Control must set focus_mode = FOCUS_NONE **and** must not carry a built-in
      mouse-hover theme state (see forbidden pattern
      native_control_hover_or_focus_on_registered_surface).
      REVISED 2026-08-19c (round-5 Step-5.5 finding F, MEDIUM-HIGH): register() takes a
      generic Node, but the mechanism-14 obligation above (focus_mode, hover StyleBox) only
      means anything for Control. If BOARD_TILE is implemented as Node2D/Area2D — the common
      tactical-board approach — mechanism 14 is not "risky" for it, it is INAPPLICABLE. Two
      revisions follow. (1) The root node type is NOT constrained to Control: Control and its
      subclasses carry both mechanism-14 conditions as hard requirements; non-Control roots
      are structurally exempt (no focus_mode, no theme StyleBox, not in the GUI focus/hover
      pipeline, so neither second-highlight path exists). Forcing a uniform type would
      upgrade a presentation constraint into an architectural limit on how the tactical board
      is built, which belongs to the not-yet-written tactical algorithm-layer ADR.
      (2) mouse_filter is deliberately NOT constrained on registered surfaces — after the
      allowlist inversion (see api decision cursor_unregistered_surface_hover_visibility) it
      no longer affects any decision this system makes.
      SEE ALSO: the SECOND, structurally independent registration table added in the same
      revision — interface contract cursor_native_pointer_exception_registration.
    added: 2026-08-18
    revised: "2026-08-19c"

  - contract: cursor_native_pointer_exception_registration
    status: active
    pattern: method_call
    producer: cursor-highlight-state
    consumers:
      - settings-ui               # non-modal settings sidebar (AC-60's own example, Not Started)
      - notification-toast        # achievement toast (AC-60's own example, Not Started)
    adr: docs/architecture/adr-0005-cursor-device-authority-input-architecture.md
    signal_signature: "register_native_pointer_exception(node: Control) -> RegisterResult  |  unregister_native_pointer_exception(node: Control) -> RegisterResult  |  is_native_pointer_exception(node: Node) -> bool"
    notes: >
      ADDED 2026-08-19c (ADR-0005 round-5 fixes R5-6 + Step-5.5 finding F). The SECOND
      registration table on CursorSurfaceRegistry, structurally independent of the first
      (cursor_surface_registration) — they do not share a tag space.
      PURPOSE: after mechanism 13a's hover test was inverted from a denylist to an allowlist,
      any unregistered surface that wants the AC-60 carve-out (native mouse pointer stays
      visible while keyboard/gamepad holds authority) must register itself here. Not
      registering means the native pointer stays hidden on that surface.
      WHY TWO TABLES AND NOT ONE TABLE WITH A FLAG: the two have different lifetime owners.
      Registered surfaces are governed by this system's registry (one instance per
      SurfaceType tag, enum-keyed). AC-60 exception surfaces are explicitly OUTSIDE this
      system's jurisdiction — arbitrarily many, untagged, free to come and go. Merging them
      would produce a "not governed, but listed in the governance table" contradiction and
      would pollute the iteration semantics of registered_surfaces_sorted().
      TYPE IS Control, not Node: a non-Control node never appears in
      gui_get_hovered_control()'s return value, so registering one would be meaningless.
      FAILURE DIRECTION IS DELIBERATE: a missing or unmatched registration costs only AC-60's
      convenience; the previous denylist form failed toward violating Core Rules #5.
    added: "2026-08-19c"
    revised: ""

  - contract: cursor_state_change_signals
    status: active
    pattern: signal
    producer: cursor-highlight-state
    consumers:
      - tactical-combat-system    # or any downstream reader that prefers push over polling _process()
      - battle-hud
      - affinity-visual-ui
      - support-conversation-ui
    adr: docs/architecture/adr-0005-cursor-device-authority-input-architecture.md
    signal_signature: "target_changed()  |  device_authority_changed()"
    notes: >
      ADR-0005 fix N4. Payload-free by design: subscribers re-query via the existing
      get_current_target() / get_device_authority() getters rather than holding a value
      carried on the signal — this mirrors the existing discipline of returning copies, not
      internal references (forbidden pattern returning_internal_container_references,
      ADR-0001), applied to signal payloads instead of return values.
      Emitted synchronously (Godot signals dispatch in the same call stack by default) only
      AFTER all field mutations for that call are fully committed. Godot's process_priority
      ladder (cursor_actor_process_priority_ladder) remains the TIMING guarantee (same-frame
      handoff); these signals are an ADDITIONAL immediate-notification channel for systems
      that don't want to poll every frame — polling and push coexist, neither replaces the
      other.
      Reentrancy: see forbidden pattern cursor_state_write_from_own_signal_handler. Do not
      connect with CONNECT_DEFERRED — that would push dispatch to end-of-frame idle
      processing and break the same-frame guarantees this system depends on.
    added: 2026-08-19
    revised: ""

  - contract: mouse_reclaim_reset_triggered_signal
    status: active
    pattern: signal
    producer: cursor-highlight-state
    consumers:
      - cursor-highlight-state    # the presentation-layer self-drawn cursor node (mechanism 13)
    adr: docs/architecture/adr-0005-cursor-device-authority-input-architecture.md
    signal_signature: "reset_triggered(trigger: CursorTypes.ResetTrigger)"
    notes: >
      ADR-0005 fix F3. Declared on the @abstract MouseReclaimPolicy base class, emitted
      inside every concrete reset() implementation. Lets the presentation layer distinguish
      trigger (d) (same-frame veto, the ONLY reset point AC-41b allows to snap the visible
      alpha to zero instantly) from triggers (a)/(b)/(c) (must converge within
      reclaim_visual_convergence_max_frames, never snap — AC-41). Without this signal the
      three-method contract (evaluate/reclaim_progress/reset) gave the presentation layer no
      way to tell which reset caused a given zeroing, which is exactly what caused the
      original F3 defect (direct modulate.a = reclaim_progress() binding, violating AC-41
      for triggers a/b/c).
      LIFETIME GOTCHA — SUPERSEDED 2026-08-19c (R5-3 + S-4): the old text said the code
      performing a swap must explicitly reconnect reset_triggered on the new instance. There
      is no runtime swap channel: _reclaim is injected only at CursorState._init(), so
      "replacement" means rebuilding CursorState and the question does not arise.
      REVISED 2026-08-19b (round-4): ResetTrigger gained a FIFTH value, SURFACE_HANDOFF,
      emitted by handoff branches 甲/乙 (TR-cursor-015 gap a). Its source rule is GDD Core
      Rules #7 F2-2, NOT Core Rules #3 — #3 still has exactly four trigger points, and the
      enum must not be read as claiming otherwise. Presentation treatment of SURFACE_HANDOFF
      is identical to (a)/(b)/(c): converge, never snap. Only (d) VETOED_SAME_FRAME snaps.
      Also revised: the presentation-side smoother this signal feeds is now DIRECTION-SPLIT
      (rising immediate, falling rate-limited) — see api decision cursor_visual_carrier_split.
      REVISED 2026-08-19c (round-5 R5-3): the presentation node does NOT subscribe to this
      signal on the MouseReclaimPolicy instance — it has no access to that instance. It
      subscribes to CursorState's FORWARDED signal reclaim_reset_triggered(trigger), which
      CursorState connects to _reclaim.reset_triggered inside _init() and re-emits verbatim.
      The producer of the abstract-class-level signal is unchanged; what changed is the only
      legal subscription channel. NOTE: the whole forward chain runs synchronously inside
      _mutation_in_progress == true (GDScript signals dispatch on the same call stack), so a
      handler must never call back into a write entry — see forbidden pattern
      cursor_state_write_from_own_signal_handler. The specified handler only sets a bool.
    added: 2026-08-19
    revised: "2026-08-19c"
  - contract: affinity_pairing_data_per_query_refetch
    status: active
    pattern: method_call
    producer: affinity-data-pool
    consumers:
      - affinity-position-linkage   # system #5; reads polarity+strength to compute Phi
    adr: none                       # no new ADR — upstream (ADR-0002) already Accepted and
                                    # already names combat_strength_read. What was missing is
                                    # a RECORDED OBLIGATION, not a decision between options.
    signal_signature: "AffinityDataPool.combat_strength_read(pair, t_query=t_now) -> result (polarity+strength, float)"
    notes: >
      PAIRING DATA MUST BE RE-FETCHED ON EVERY Phi QUERY — same freshness class as the
      position snapshot, NOT loaded once at construction.
      Measured 2026-08-31: AffinityPhiProvider._links is loaded once in _init() and never
      re-read (its own doc comment says "fixed for the provider's lifetime"), while
      positions() IS correctly rebuilt every call. That asymmetry silently breaks
      affinity-position-chain.md's States-and-Transitions promise ("always reflects the
      polarity at query time"): a dialogue card that flips a pair's polarity mid-battle
      would not be seen until the provider is reconstructed.
      The vertical slice additionally reads a STATIC FILE
      (assets/data/affinity/vs01_affinity_links.txt) rather than the pool at all — that is a
      known stopgap, and migrating it is the story this obligation governs. Migrating the
      data SOURCE without also fixing the per-call re-fetch would satisfy the letter of the
      migration and still ship the bug.
      OPEN, DELIBERATELY UNDECIDED: the pool returns an unbounded real; Phi's formula
      consumes an int amp. The quantisation (round / bucket / sign-only) is NOT decided here
      — amp's value range is owned by the card system (#6), and deciding now would be a
      guess. Today amp is hardcoded 1, i.e. sign-only: pairs at strength 0.05 and 500 yield
      an IDENTICAL Phi. See affinity-position-chain.md OQ-3.
    referenced_by:
      - design/gdd/affinity-position-chain.md
      - design/gdd/affinity-data-pool.md
    added: 2026-08-31
    revised: ""

  - contract: phi_curve_enemy_advantage_cross_calibration
    status: open_gap
    pattern: shared_resource
    producer: affinity-position-linkage      # owns the four R3 curve constants
    consumers:
      - tactical-combat-system               # owns enemy_advantage_pct (currently 0.20)
    adr: none                                # nothing to DECIDE — only to record and enforce.
    signal_signature: "n/a — numeric coupling across two GDDs, no runtime interface"
    notes: >
      THE FOUR R3 CONSTANTS (+3 / -1 / -1 / +2) AND enemy_advantage_pct MUST NOT BE TUNED
      INDEPENDENTLY. affinity-position-chain.md states this obligation in prose, but there is
      NO equation linking them, no shared source of truth, and no failing test — its
      "cross-calibration result" section is a MEASUREMENT, not a derivation. The two values
      live in different documents, so whoever tunes enemy_advantage_pct has no way to
      discover this obligation exists. This row IS the discovery mechanism.
      Required on any change to either side: re-verify "output-channel Phi >= enemy advantage
      gap" and record the result in BOTH documents.
      SCOPE LIMIT, MEASURED: Phi covers only the OUTPUT channel (enemy DEF inflation, gap
      2-3 pts). The DAMAGE-TAKEN channel (enemy ATK inflation, gap up to 6 pts) is NOT
      covered by Phi at all — Phi is an attacker-side one-way bonus. Players can hit harder;
      they cannot take less.
      WHEN TO REVISIT — this row does NOT own the trigger. tactical-combat-system.md's
      OQ-14 and OQ-15 already own it ("首次可玩建置後的平衡校準" — after the first playable
      build; owner 使用者 + systems-designer). Added 2026-08-31 round-2: this row was
      written without cross-referencing them, so the project had a tracked revisit trigger
      and a recorded obligation sitting in two places that did not point at each other.
      status is open_gap (not active) because BOTH sides are still uncalibrated: the current
      build needs ~6 hits to kill against a 4-hit target. Enforcement lands as an ADVISORY-
      level AC deliberately, NOT blocking — a blocking assertion here would be red from day
      one for a reason nobody should act on yet, which is exactly the unreadable-red-CI
      failure this project's own CI standards warn about. It becomes a meaningful gate once
      calibration happens.
    referenced_by:
      - design/gdd/affinity-position-chain.md
      - design/gdd/tactical-combat-system.md
    added: 2026-08-31
    revised: ""
