      downstream system read is_current_target_valid() from its own _input()/
      _unhandled_input(), that read could happen BEFORE _process() even starts, violating
      AC-52 (a same-frame accept on a target the caller just invalidated).
      NEW VALUE (5 tiers): adds a -50 tier for caller active retag, and elevates "confirm
      reads must be in _process(), never _input()/_unhandled_input()" from an internal
      discipline (see forbidden pattern unhandled_input_for_device_authority, which only
      covered THIS system's own buffer) to an explicit constraint ON DOWNSTREAM SYSTEMS —
      see forbidden pattern confirm_action_read_in_unhandled_input. Device-authority
      resolution and buffered navigation-class writes remain fused in one atomic
      arbitrate_frame() call at -100 because nothing observable depends on their relative
      order within that single call — the only externally-observable ordering requirement
      is caller-retag-after-arbiter, before-confirm-read, which the new -50 tier plus the
      downstream constraint now provides.
