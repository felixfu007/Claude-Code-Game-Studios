      point actor (3)'s own rule ("must be strictly between (2) and (4)") becomes
      unsatisfiable. The two rows cross-read to the right answer, but the literal text
      permits a configuration that breaks the four-step ordering.
      SETTLED: reference value -60 (clear of both endpoints, so a downstream +/-10 tweak
      cannot collide), range stated as the open interval.
      ALSO SETTLED — the ADR's two inconsistent statements about EQUAL priorities: "lower
      number runs first" holds ONLY BETWEEN DISTINCT VALUES; for equal values this ADR
