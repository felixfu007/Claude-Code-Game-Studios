# Architecture Decision Registry
#
# PURPOSE: Single source of truth for key architectural stances that all ADRs
# must agree on. Skills check this before writing new ADRs to detect conflicts
# at authoring time — before stories are created against contradictory decisions.
#
# RULES:
#   - Register a stance when it constrains how OTHER systems must be built.
#     An internal implementation detail that affects only one ADR does not need
#     to be registered.
#   - Never delete entries — set status: superseded_by: ADR-NNNN instead.
#   - When a stance changes: update the entry, set revised: to today's date,
#     add a comment with the old value, and run /architecture-review to check
#     what ADRs are now invalidated.
#   - adr: is the authoritative source. All other ADRs that depend on this
#     stance list themselves in referenced_by.
#
# WRITTEN BY: /architecture-decision (Phase 5 — after ADR is approved)
# READ BY:    /architecture-decision (Step 2 — before authoring begins)
#             /architecture-review (Phase 4 — cross-ADR conflict baseline)
#             /create-stories (to embed architectural constraints in stories)
#             /dev-story (to check implementation against accepted stances)
#
# SEARCH PATTERNS (for skills using Grep):
#   All state owners:       Grep pattern="^  - state:" path="docs/registry/architecture.yaml"
#   Who owns player_health: Grep pattern="state: player_health"
#   All signal contracts:   Grep pattern="pattern: signal"
#   Budget for combat:      Grep pattern="system: combat"
#   All forbidden patterns: Grep pattern="^  - pattern:" (forbidden_patterns section)
#   Superseded entries:     Grep pattern="status: superseded"

version: 1
last_updated: "2026-08-18"

# ─── STATE OWNERSHIP ─────────────────────────────────────────────────────────
# Who is the authoritative owner of each piece of shared game state.
# Conflicts: two ADRs claiming to own the same state = data race / authority bug.
#
# Register state when it is READ or WRITTEN by more than one system.
# Internal-only state (never accessed by another system) does not need to be registered.
#
# Required fields: state, owner_system, adr, interface, referenced_by[], added
# interface: how other systems access this state (read-only property, method call,
#   signal, shared resource, etc.) — this is the contract other ADRs depend on.

state_ownership:
  - state: board_version
    status: active
    owner_system: tactical-combat-system
    adr: docs/architecture/adr-0001-tactical-query-atomicity-contract.md
    interface: "Board.board_version (read-only int, monotonic). Query results carry the version they were computed against; a result is valid iff result.version == board.board_version."
    write_access: board-only
    notes: "Increments ONLY at committed settlement boundaries. Must NOT increment on read-only operations (cursor movement, overlay toggle, prediction marker) — those are zero-write per tactical-combat-system.md Core Rules #8/#10."
    referenced_by:
      - docs/architecture/adr-0001-tactical-query-atomicity-contract.md
    added: 2026-08-18
    revised: ""

  - state: occupied
    status: active
    owner_system: tactical-combat-system
    adr: docs/architecture/adr-0001-tactical-query-atomicity-contract.md
    interface: "Board.is_occupied(tile: Vector2i) -> bool / Board.occupant_of(tile: Vector2i) -> int. Backed by a sparse Dictionary[Vector2i, int] (value = unit_id)."
    write_access: board-only
    notes: "Synced on ANY event changing a unit's logical position or alive state (death at settlement step 4, movement logical completion — non-exhaustive), atomically with the board_version increment. Never derived from scene-tree existence or visual/animation state."
    referenced_by:
      - docs/architecture/adr-0001-tactical-query-atomicity-contract.md
    added: 2026-08-18
    revised: ""

  - state: settlement_in_progress
    status: active
    owner_system: tactical-combat-system
    adr: docs/architecture/adr-0001-tactical-query-atomicity-contract.md
    interface: "Board.settlement_in_progress (read-only bool). True from settlement step 1 start until step 4 completion."
    write_access: board-only
    notes: "While true, ALL player input is rejected with explicit feedback (not queued). Must not remain true across two consecutive _process frames — if it does, push_error(); that state means a never-resuming await has permanently deadlocked input."
    referenced_by:
      - docs/architecture/adr-0001-tactical-query-atomicity-contract.md
    added: 2026-08-18
    revised: ""

# Example:
#
# state_ownership:
#   - state: player_health
#     status: active           # active | superseded_by: ADR-NNNN
#     owner_system: health-system
#     adr: docs/architecture/adr-0001-health-system.md
#     interface: "HealthComponent.current_health (read-only float, range 0–max_health)"
#     write_access: health-system-only   # only owner can write; others read
#     referenced_by:
#       - docs/architecture/adr-0001-health-system.md
#       - docs/architecture/adr-0003-combat-system.md   # reads to apply damage
#       - docs/architecture/adr-0007-ui-system.md       # reads to display HUD
#     added: 2026-03-26
#     revised: ""


# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How systems are required to communicate with each other.
# Conflicts: one ADR expects signal, another expects direct call = integration bug.
#
# Register a contract when the communication pattern between two systems is
# explicitly decided in an ADR and other systems must follow the same pattern.
#
# pattern options: signal | direct_call | event_bus | shared_resource | rpc | none

interfaces:
  - contract: query_result_versioning
    status: active
    pattern: shared_resource
    producer: tactical-combat-system
    consumers:
      - battle-hud                # renders overlays; must check is_stale() before accepting input
      - affinity-position-linkage # reads adjacency/placement queries (system #5, Not Started)
    adr: docs/architecture/adr-0001-tactical-query-atomicity-contract.md
    signal_signature: "QueryResult.version: int + QueryResult.is_stale(board: Board) -> bool"
    notes: >
      EVERY outbound query of tactical-combat-system returns a result carrying the
      board_version it was computed against. Consumers must not accept player input
      based on a result whose is_stale() is true. Result containers are always newly
      allocated — never references into Board's internal storage.
    referenced_by:
      - docs/architecture/adr-0001-tactical-query-atomicity-contract.md
    added: 2026-08-18
    revised: ""

  - contract: composite_query_consistency
    status: active
    pattern: shared_resource
    producer: tactical-combat-system
    consumers:
      - battle-hud
    adr: docs/architecture/adr-0001-tactical-query-atomicity-contract.md
    signal_signature: "QueryResult.assert_same_version(results: Array[QueryResult]) -> bool"
    notes: >
      Any set of query outputs merged into ONE picture for the player — the co-visible
      movement-range and threat-range overlays required by tactical-combat-system.md
      UI §1a, and threat_range_all(E)'s N-enemy union — counts as a single query and
      must share one board_version. Stitching results from different versions produces
      a picture corresponding to no real board state.
    referenced_by:
      - docs/architecture/adr-0001-tactical-query-atomicity-contract.md
    added: 2026-08-18
    revised: ""

