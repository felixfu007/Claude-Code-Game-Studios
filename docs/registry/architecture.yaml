# Architecture Decision Registry
#
# PURPOSE: Single source of truth for key architectural stances that all ADRs
# must agree on. Skills check this before writing new ADRs to detect conflicts
# at authoring time — before stories are created against contradictory decisions.
#
# RULES:
#   - Register a stance when it constrains how OTHER systems must be built.
#     An internal implementation detail that affects only one ADR does not need
#     to be registered.
#   - Never delete entries — set status: superseded_by: ADR-NNNN instead.
#   - When a stance changes: update the entry, set revised: to today's date,
#     add a comment with the old value, and run /architecture-review to check
#     what ADRs are now invalidated.
#   - adr: is the authoritative source. All other ADRs that depend on this
#     stance list themselves in referenced_by.
#
# WRITTEN BY: /architecture-decision (Phase 5 — after ADR is approved)
#
# READ BY (MEASURED 2026-08-31 — grep for "architecture.yaml" in each SKILL.md):
#             /architecture-decision  ✅ 6 hits (Step 2 — before authoring begins)
#             /architecture-review    ❌ 0 hits — DOES NOT read this file
#             /create-stories         ❌ 0 hits — DOES NOT read this file
#             /dev-story              ❌ 0 hits — DOES NOT read this file
#             /story-readiness        ❌ 0 hits — DOES NOT read this file
#
# 🔴 THIS HEADER USED TO CLAIM ALL FOUR OF THE ABOVE READ THIS FILE. THREE OF THOSE
#    CLAIMS WERE FALSE, and the one that is true only runs while AUTHORING A NEW ADR.
#    Corrected 2026-08-31 (round-2 /design-review of affinity-position-chain.md,
#    verified twice independently by grep).
#
#    WHAT THIS MEANS FOR ANYONE RELYING ON A ROW HERE: a stance registered in this
#    file is NOT mechanically enforced anywhere. Contrast a real ADR, which carries a
#    Blocks/TR-ID field that /story-readiness walks via the Status/Depends-On chain —
#    that is how ADR-0002 actually holds back its 24 TR-affinity-* items. A row in
#    this registry has no equivalent; its only enforcement path is a human happening
#    to read the GDD that points at it.
#
#    So: registering a stance HERE INSTEAD OF writing an ADR is a real trade — it is
#    cheaper and avoids an unnecessary decision document, but it buys documentation
#    WITHOUT enforcement. If a row must actually block work, it needs a test, a
#    TR-ID, or an ADR. Do not assume this file gates anything on its own.
#
# SEARCH PATTERNS (for skills using Grep):
#   All state owners:       Grep pattern="^  - state:" path="docs/registry/architecture.yaml"
#   Who owns player_health: Grep pattern="state: player_health"
#   All signal contracts:   Grep pattern="pattern: signal"
#   Budget for combat:      Grep pattern="system: combat"
#   All forbidden patterns: Grep pattern="^  - pattern:" (forbidden_patterns section)
#   Superseded entries:     Grep pattern="status: superseded"

