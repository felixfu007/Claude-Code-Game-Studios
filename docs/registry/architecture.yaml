# ─── STATE OWNERSHIP ─────────────────────────────────────────────────────────
# Who is the authoritative owner of each piece of shared game state.
# Conflicts: two ADRs claiming to own the same state = data race / authority bug.
#
# Register state when it is READ or WRITTEN by more than one system.
# Internal-only state (never accessed by another system) does not need to be registered.
#
# Required fields: state, owner_system, adr, interface, referenced_by[], added
# interface: how other systems access this state (read-only property, method call,
#   signal, shared resource, etc.) — this is the contract other ADRs depend on.

state_ownership:
  - state: board_version
    status: active
    owner_system: tactical-combat-system
    adr: docs/architecture/adr-0001-tactical-query-atomicity-contract.md
    interface: "Board.board_version (read-only int, monotonic). Query results carry the version they were computed against; a result is valid iff result.version == board.board_version."
    write_access: board-only
    notes: "Increments ONLY at committed settlement boundaries. Must NOT increment on read-only operations (cursor movement, overlay toggle, prediction marker) — those are zero-write per tactical-combat-system.md Core Rules #8/#10."
    referenced_by:
      - docs/architecture/adr-0001-tactical-query-atomicity-contract.md
    added: 2026-08-18
    revised: ""

  - state: occupied
    status: active
    owner_system: tactical-combat-system
    adr: docs/architecture/adr-0001-tactical-query-atomicity-contract.md
    interface: "Board.is_occupied(tile: Vector2i) -> bool / Board.occupant_of(tile: Vector2i) -> int. Backed by a sparse Dictionary[Vector2i, int] (value = unit_id)."
    write_access: board-only
    notes: "Synced on ANY event changing a unit's logical position or alive state (death at settlement step 4, movement logical completion — non-exhaustive), atomically with the board_version increment. Never derived from scene-tree existence or visual/animation state."
    referenced_by:
      - docs/architecture/adr-0001-tactical-query-atomicity-contract.md
    added: 2026-08-18
    revised: ""

  - state: settlement_in_progress
    status: active
    owner_system: tactical-combat-system
    adr: docs/architecture/adr-0001-tactical-query-atomicity-contract.md
    interface: "Board.settlement_in_progress (read-only bool). True from settlement step 1 start until step 4 completion."
    write_access: board-only
    notes: "While true, ALL player input is rejected with explicit feedback (not queued). Must not remain true across two consecutive _process frames — if it does, push_error(); that state means a never-resuming await has permanently deadlocked input."
    referenced_by:
      - docs/architecture/adr-0001-tactical-query-atomicity-contract.md
    added: 2026-08-18
    revised: ""

  - state: affinity_delta_log
    status: active
    owner_system: affinity-data-pool
    adr: docs/architecture/adr-0002-affinity-data-pool-data-structure-and-concurrency-contract.md
    interface: "AffinityDataPool.append_record(pair, m, source) -> WriteRejection (write); AffinityDataPool.combat_strength_read/narrative_depth_read/shape_feature_read/speculative_read (read). Backed by Dictionary[AffinityTypes.Pair, AffinityRecordList] (2026-08-20 revision - the original nested form does not compile in 4.7.1). Inner array is PRIVATE _items: Array[AffinityRecord], reached only via append()/size()/get_at() (2026-08-21 revision, R7E-12). All four read functions return their result object with a rejection: ReadRejection field - none returns Variant (2026-08-21)."
    write_access: affinity-data-pool-only (via append_record; writers are skill-card, support-conversation, and chapter/campaign-structure systems calling this single method)
    notes: "Append-only. t_now/campaign tick are derived, cached values, never persisted independently. Per-pair indexed for O(n_p+m) query complexity — see affinity_pair_key_representation below."
    referenced_by:
      - docs/architecture/adr-0002-affinity-data-pool-data-structure-and-concurrency-contract.md
    added: 2026-08-18
    revised: "2026-08-21"  # 2026-08-20 巢狀型別容器改包裝類別 AffinityRecordList;2026-08-21 內層陣列改私有 _items + 最小存取面(R7E-12),讀取回傳型別全部去 Variant(R7E-6/R7E-5)

  - state: affinity_death_marks
    status: active
    owner_system: affinity-data-pool
    adr: docs/architecture/adr-0002-affinity-data-pool-data-structure-and-concurrency-contract.md
    interface: "AffinityDataPool.notify_death(character: AffinityTypes.Character) -> DeathNotifyResult (write, idempotent-reject on duplicate). Backed by Dictionary[AffinityTypes.Character, int]."
    write_access: affinity-data-pool-only (via notify_death; sole legitimate caller is tactical-combat-system, a reverse Foundation←Gameplay dependency — must NOT be relayed through affinity-position-linkage, see affinity_death_notification below)
    notes: "Not incremented alongside the global write counter (t_now) — records t_now's current value at the moment of death, unchanged. Relative call order vs. append_record() in the same settlement step determines write legality (Core Rules #2 of affinity-data-pool.md) and is tactical-combat-system's decision to make, not this system's."
    referenced_by:
      - docs/architecture/adr-0002-affinity-data-pool-data-structure-and-concurrency-contract.md
    added: 2026-08-18
    revised: ""

  - state: affinity_serialization_tokens
    status: active
    owner_system: affinity-data-pool
    adr: docs/architecture/adr-0002-affinity-data-pool-data-structure-and-concurrency-contract.md
    interface: "AffinityDataPool.begin_non_atomic_window() -> int / end_non_atomic_window(token: int) -> EndTokenResult. Backed by Dictionary[int, int] (token id -> issue timestamp), Mutex-guarded unconditionally."
    write_access: affinity-data-pool-only (mutated only via begin/end; sole intended caller is save-system)
    notes: "Non-empty token set ⇒ all affinity-data-pool write methods reject with SERIALIZATION_WINDOW_ACTIVE. Multiple concurrent tokens are legal (unlike tactical-combat-system's single-flag settlement_in_progress) — supports save-system's multi-slot parallel-operation allowance. Token IDs are a monotonically increasing int, never reused."
    referenced_by:
      - docs/architecture/adr-0002-affinity-data-pool-data-structure-and-concurrency-contract.md
    added: 2026-08-18
    revised: ""

  - state: save_slot_reentrancy_lock
    status: active
    owner_system: save-system
    adr: docs/architecture/adr-0004-save-system-atomic-write-and-migration-execution-model.md
    interface: "SaveSlotLock.try_acquire(slot: int) -> bool / release(slot: int) -> void. Backed by Dictionary[int, bool], in-memory only."
    write_access: save-system-only (via the single-entry/single-release function structure, see forbidden pattern early_return_between_lock_acquire_and_release)
    notes: "Per-slot, not persisted (process restart clears all locks — no stale-lock-across-sessions risk). Gates full-read and ordinary-write interfaces only; manifest-only, migration-progress-query, and read-only-access interfaces are explicitly exempt (see Core Rules #15 classification table in ADR-0004 mechanism 10). Distinct from and independent of affinity_serialization_tokens above — two separate locks protecting two separate resources, with asymmetric failure severity (this lock has no timeout/liveness fallback, unlike the affinity token set)."
    referenced_by:
      - docs/architecture/adr-0004-save-system-atomic-write-and-migration-execution-model.md
    added: 2026-08-18
    revised: ""


  - state: cursor_target
    status: active
    owner_system: cursor-highlight-state
    adr: docs/architecture/adr-0005-cursor-device-authority-input-architecture.md
    interface: "CursorState.get_current_target() -> CursorTarget (NEWLY ALLOCATED COPY, never the internal instance). CursorTarget is a value-semantics object: {surface: CursorTypes.SurfaceType, id: int, is_valid: bool}. Compare with target.equals(other), NEVER with == (RefCounted == compares identity, not field values)."
    write_access: cursor-highlight-state-only (via set_target / mark_pending_reresolve / handoff_before_unload)
    notes: "Board coordinates are encoded to int via CursorTypes.encode_tile(coord, board_width) so `id` has ONE type across all surfaces — this is what makes equals() type-independent, which mark_pending_reresolve()'s race guard fully depends on. Only surfaces registered in CursorTypes.SurfaceType fall under this field's jurisdiction (cursor-highlight-state.md AC-60); unregistered surfaces may still transfer device authority — that is correct behaviour, not an exception."
    referenced_by:
      - docs/architecture/adr-0005-cursor-device-authority-input-architecture.md
    added: 2026-08-18
    revised: ""

  - state: cursor_device_authority
    status: active
    owner_system: cursor-highlight-state
    adr: docs/architecture/adr-0005-cursor-device-authority-input-architecture.md
    interface: "CursorState.get_device_authority() -> CursorTypes.Authority (UNINITIALIZED | MOUSE | KEYBOARD_GAMEPAD)"
    write_access: cursor-highlight-state-only (only via arbitrate_frame, or set_target with from_ui_action == true)
    notes: >
      GLOBAL and orthogonal to cursor_target (cursor-highlight-state.md Core Rules #4) —
      a surface-registration boundary constrains cursor_target only, never this field.
      Classified from the raw InputEvent SUBCLASS; the device ID is never read (see
      forbidden pattern reading_input_event_device_id). Same-frame two-device conflicts
      resolve by FIXED PRIORITY: KEYBOARD_GAMEPAD always beats MOUSE — 100% deterministic,
      never dependent on engine queue order. Only NAVIGATION-class ui_* actions and
      threshold-passing mouse motion have standing to claim authority; CONFIRM-class
      actions do not.
    referenced_by:
      - docs/architecture/adr-0005-cursor-device-authority-input-architecture.md
    added: 2026-08-18
    revised: ""

  - state: mouse_reclaim_accumulator
    status: active
    owner_system: cursor-highlight-state
    adr: docs/architecture/adr-0005-cursor-device-authority-input-architecture.md
    interface: "MouseReclaimPolicy.reclaim_progress() -> float (0.0-1.0), the DECISION value. GDD calls it `reclaim_progress`. The self-drawn progressive-feedback cursor node does NOT bind modulate.a to it directly — it holds a separate PRESENTATION value `_presented_alpha` (rising: synced immediately; falling: converged via move_toward(); trigger (d): snapped) and assigns THAT to modulate.a. Seed position readable via diagnostic_seed_position() (QA-only)."
    write_access: MouseReclaimPolicy-only (via evaluate / reset). The MouseReclaimPolicy INSTANCE is owned solely by CursorState (private _reclaim, NO getter, must not leak) — REVISED 2026-08-19c, R5-3.
    notes: >
      THIRD top-level field of cursor-highlight-state.md Core Rules #1
      REVISED 2026-08-19b (round-4 /architecture-review flagged this field as not synced
      with ADR-0005 fix F3, and ADR-0005's own round-4 revision R4-3 changed it again).
      OLD VALUE of `interface:` was "Read by the self-drawn progressive-feedback cursor
      node's modulate.a" — a direct bind, abolished by F3 (it violated AC-41 for reset
      triggers a/b/c). The R4-3 revision then split the smoother by DIRECTION: rising is
      synced immediately (GDD requires alpha == 100% AT the frame the threshold is crossed —
      a rate-limited rise makes that mathematically impossible), only falling is rate-limited.
      REVISED 2026-08-19c (round-5 R5-3, MEDIUM-HIGH): the round-5 review found the
      MouseReclaimPolicy instance had THREE consumers each assuming a different access path
      — CursorState (ctor-injected private field), CursorStateHost (mechanism 9 called
      _reclaim.reset() directly, as if it were the host's own field, contradicting "the shell
      holds no state" and edging into forbidden pattern logic_in_cursor_autoload_shell), and
      the self-drawn node (subscribed to reclaim.reset_triggered with no stated provenance).
      CursorState has no getter, so two of the three were structurally impossible.
      SETTLED: CursorState is the SOLE owner. The host forwards via the new public entry
      reseed_reclaim_on_focus_regained(); the presentation node subscribes to CursorState's
      forwarded signal reclaim_reset_triggered and reads CursorState.reclaim_progress().
      See forbidden pattern external_access_to_cursor_reclaim_instance.
      ALSO SETTLED (S-4): _reclaim is injected ONLY at CursorState._init(); there is NO
      runtime hot-swap channel. "Replacement" means rebuilding CursorState, so no stale
      signal connections can survive. A future restart of the frozen sub-mechanism that
      needs hot-swap must add an explicit disconnect() step and revise this entry.
      (`accumulated_net_displacement_px`), owned by the swappable MouseReclaimPolicy
      rather than sitting directly on CursorState.
      WARNING — THIS SUB-MECHANISM IS FROZEN: the user ruled in the GDD's round 12
      (2026-08-11) that the mouse-reclaim redesign is SUSPENDED and candidate fixes are
      no longer pursued, pending gamepad hardware. Two CONFIRMED, UNFIXED defects live
      inside ThresholdMouseReclaimPolicy: (E1, spike-log verified, 100% reproducible)
      holding an analog stick permanently locks out mouse reclaim; (E2, verbal
      observation) a successful reclaim is instantly stolen back by the reverse-direction
      zero-threshold exemption. ADR-0005 mechanism 8 does NOT mitigate either — it only
      confines the fix radius to one file. Do not treat this entry as a working contract.
    referenced_by:
      - docs/architecture/adr-0005-cursor-device-authority-input-architecture.md
    added: 2026-08-18
    revised: "2026-08-19c"
