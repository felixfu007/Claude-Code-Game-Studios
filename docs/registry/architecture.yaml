      INDEPENDENT concepts; these numbers refer only to the former.
      UNVERIFIED PREMISE (ADR-0005 Verification Required #2, risk HIGH): that all _input()
      calls for a frame complete before that frame's _process(). godot-specialist:
      LIKELY-BUT-UNVERIFIED, mid-high confidence, training-data impression only — the
      project's engine reference has ZERO coverage of process_priority. Supporting
      inference: the Agile Event Flushing setting would have no meaning if the main loop
      did not batch input before the processing phase. VERIFY ON DAY ONE of implementation.
      REVISED 2026-08-19b (round-4 R4-1): the drain is now TWO calls on TWO nodes. The
      "collect the whole frame, then arbitrate" premise is unaffected — both calls sit in
      the same frame's _process phase, both after all _input(). What DID change: a new
      intermediate state exists between -100 and -25 ("authority resolved, navigation not
      yet applied"). If _arbitration_suspended flips true in that window, the authority
      decision for that frame stands (not rolled back) while the navigation write is dropped
      (suspend_arbitration() clears the buffer). Deliberately accepted — device authority is
      a global field whose transfer is not bounded by screen edges; deferring the authority
      decision to -25 instead would directly re-violate the GDD's four-step sequence.
      REVISED 2026-08-19c (round-5 R5-2, MEDIUM): actor (2) was written as "-50 (any value
