    adr: docs/architecture/adr-0005-cursor-device-authority-input-architecture.md
    reason: >
      ADR-0005 fix N1 (round-3 architecture-review, godot-specialist finding). Mechanism 6's
      arbitration rule ("only NAVIGATION-class ui_* actions may contest device authority")
      had no stated implementation mechanism at all — classify() (cursor_device_classification)
      only does device-type matching, not action-semantic matching, and this dependency was
      missing from the ADR's own core-dependency coverage table despite being as load-bearing
      as classify() itself.
      InputMap.event_is_action() is in the same API family as InputMap.get_actions()/
      action_get_events(), already confirmed stable 4.5->4.7 by godot-specialist in GDD
      round 10; this call was independently confirmed stable and un-deprecated by
      godot-specialist during the ADR-0005 revision validation.
      REVISED 2026-08-19b (round-4 R4-5, MEDIUM-HIGH): the N1 fix used a CLOSED six-item
      hardcoded list while the GDD defines "navigation-class ui_* action" SEMANTICALLY and
      OPEN-ENDEDLY ("an action that semantically means 'move the cursor'"). Consequence: any
      future ui_* action that is semantically navigational — project-custom, or an engine
      built-in like ui_focus_next / ui_page_up being enabled — is SILENTLY classed as OTHER,
      loses its right to contest device authority, and NO startup or runtime check catches
      it. Inconsistent with this ADR's own never-silent discipline (mechanism 10's split
      queries, mechanism 7(b)'s has_setting() guard). Validator check (a) does walk every
      ui_* action, but verifies an entirely different property (mouse misbinding) and does
      no classification cross-check.
      WHY AN EXPLICIT THREE-WAY PARTITION RATHER THAN "report anything unmatched": the
      latter would flag dozens of engine built-ins at startup — noise loud enough that an
      implementer would simply switch the check off, producing something worse than silence.
      The partition forces each ui_* action to be classified by a human ONCE; forgetting to
      classify a newly added one fails at load. Same principle as mechanism 7(b): make the
      unverified state expose itself at runtime instead of defaulting silently.
      UNVERIFIED SEMANTICS (round-4, Verification Required #13, HIGH): whether
      InputMap.event_is_action() filters InputEventKey.echo. If it does not, every repeat
      event from a HELD direction key classifies as NAVIGATION — i.e. authority is contested
      every frame, feeding straight into reset trigger (d) and the E1 permanent-lockup
      defect. ADR-0005 deliberately does NOT pre-add an echo filter: the correct handling is
      coupled to the FROZEN reclaim sub-mechanism, and guessing now would amount to making a
      design ruling inside the frozen scope. Also confirmed-by-design: event_is_action()
      necessarily returns false for InputEventMouseMotion (mouse contests authority via the
      mechanism-8 threshold path, not the action path).
