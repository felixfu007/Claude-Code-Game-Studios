      "same-priority bucket is stably ordered by registration" belief is IMPRESSION, with no
      official doc or project reference-library support — it must not be promoted to
      verified). Therefore the six architecturally-mandated priority values MUST BE PAIRWISE
      DISTINCT; this is a precondition of the ordering guarantee, not a suggestion. Actors
