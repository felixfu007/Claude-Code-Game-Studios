  - purpose: cursor_action_class_classification
    status: active
    api: "InputMap.event_is_action(event, action_name) checked against an EXPLICIT THREE-WAY PARTITION of every ui_* action (REVISED 2026-08-19b, round-4 R4-5): NAVIGATION_ACTIONS (ui_up/ui_down/ui_left/ui_right) | CONFIRM_ACTIONS (ui_accept/ui_cancel) | ACKNOWLEDGED_OTHER_ACTIONS (engine built-ins explicitly reviewed and ruled non-navigational: ui_focus_next, ui_focus_prev, ui_page_up, ui_page_down, ui_home, ui_end, ui_select, ui_menu — a starting point, to be completed against the project's actual InputMap). CursorStartupValidator check (c) walks InputMap.get_actions() and reports UI_ACTION_UNCLASSIFIED, with the offending action name, for any ui_* action matching none of the three"
