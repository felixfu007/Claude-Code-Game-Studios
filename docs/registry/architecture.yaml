      cursor_unregistered_surface_hover_visibility) — Input.mouse_mode was previously an
      unconditional binary switch on device authority alone.
      REVISED AGAIN 2026-08-19b (round-4 R4-3, HIGH / treated as BLOCKING): the F3 smoother
      rate-limited BOTH directions. GDD Core Rules #3 requires alpha "proportional to the
      movement progress — 0% invisible, 100% AT THE MOMENT the threshold is reached,
      simultaneously with the authority transfer", and the convergence-cap rule's scope is
      textually limited to "resets not directly caused by player mouse action" — i.e. the
      FALLING direction only. The GDD never rate-limits the RISE. With
      reclaim_visual_convergence_max_frames effectively >= 2 (a value of 1 means single-frame
      snap, self-contradictory), max_step <= 0.5, while the GDD's provisional 50-100px
      threshold is crossed in 2-3 frames at ordinary mouse speeds — so _presented_alpha was
      STRUCTURALLY INCAPABLE of reaching 1.0 at the crossing frame. A purely mathematical
      violation, dependent on no unverified engine behaviour. godot-specialist's summary,
