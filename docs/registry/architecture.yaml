# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: grid_occupancy_storage
    status: active
    api: "Dictionary[Vector2i, int]  # sparse, value = unit_id"
    not: "dense 2D array / PackedInt32Array; scene-tree lookup (get_node / has_node)"
    adr: docs/architecture/adr-0001-tactical-query-atomicity-contract.md
    reason: >
      Sparse storage does not require a board-size upper bound, which is still undecided
      (tactical-combat-system.md OQ-16). Units are far sparser than tiles on a tactics
      board. Vector2i is a valid, O(1) Dictionary key in Godot 4.x with stable hashing
      semantics across 4.3-4.7.
    referenced_by:
      - docs/architecture/adr-0001-tactical-query-atomicity-contract.md
    added: 2026-08-18
    revised: ""

  - purpose: query_snapshot_identity
    status: active
    api: "monotonic board_version int stamp, incremented at committed settlement boundaries"
    not: "deep-copied BoardSnapshot object; per-frame batch recomputation"
    adr: docs/architecture/adr-0001-tactical-query-atomicity-contract.md
    reason: >
      Core Rules #11 confines all board mutation to settlement boundaries and makes
      settlement non-re-entrant, so the board is effectively immutable BETWEEN boundaries.
      A snapshot therefore needs only an identity stamp, not a copy — cost is one int
      compare instead of a per-query deep copy on the high-frequency cursor-as-view path.
      CAVEAT: this rests on Core Rules #11 holding. If system #6 (skill cards) later
      proves it cannot satisfy the synchronous-effect contract, re-evaluate the
      explicit-snapshot alternative documented in the ADR.
    referenced_by:
      - docs/architecture/adr-0001-tactical-query-atomicity-contract.md
    added: 2026-08-18
    revised: ""

  - purpose: affinity_data_pool_ownership
    status: active
    api: "dependency-injected plain RefCounted instance, constructed once at campaign start, passed by reference to consuming systems"
    not: "Autoload singleton"
    adr: docs/architecture/adr-0002-affinity-data-pool-data-structure-and-concurrency-contract.md
    reason: >
      .claude/docs/coding-standards.md requires dependency injection over singletons for
      unit-testability. An Autoload would force tests to reset global state between
      cases; a DI instance can be freshly `new`'d per test with no scene-tree dependency.
      Precedent for future data-layer systems (e.g. save-system) considering the same
      ownership question — default to DI unless a concrete reason forces Autoload.
    referenced_by:
      - docs/architecture/adr-0002-affinity-data-pool-data-structure-and-concurrency-contract.md
    added: 2026-08-18
    revised: ""

  - purpose: affinity_pair_key_representation
    status: active
    api: "enum Pair (10 fixed members) wrapped in class_name AffinityTypes, constructed via AffinityTypes.pair_of(a, b) canonical lookup. PRECONDITION (2026-08-21): callers MUST validate both arguments with AffinityTypes.is_valid_character() first - pair_of() returns a bare Pair and has no rejection channel, so its behaviour on an illegal ordinal is undefined. See forbidden pattern unvalidated_character_into_pair_of."
    not: "runtime-normalized Array[Character] composite key"
    adr: docs/architecture/adr-0002-affinity-data-pool-data-structure-and-concurrency-contract.md
    reason: >
      Array is technically usable as a GDScript Dictionary key (content-based hash/equality,
      not reference-based), but a mutable container used as a key is a known risk pattern —
      if the same Array instance is later mutated elsewhere, it silently corrupts the hash
      bucket. An explicit enum is an int under the hood, immutable by construction, and the
      canonical constructor hides the 10-combination lookup from callers. See also
      forbidden pattern mutable_container_as_dictionary_key below.
      2026-08-21: an enum being "an int under the hood" is exactly why the type annotation
      does NOT constrain the ordinal - probe B measured out-of-range ints (-1/999) reaching
      the function body unchanged. pair_of() is the one entry that cannot carry a rejection
      code, hence the caller precondition above.
    referenced_by:
      - docs/architecture/adr-0002-affinity-data-pool-data-structure-and-concurrency-contract.md
    added: 2026-08-18
    revised: ""

  - purpose: affinity_serialization_token_type
    status: active
    api: "monotonically increasing int, never reused (_next_token_id counter)"
    not: "RefCounted object identity as token"
    adr: docs/architecture/adr-0002-affinity-data-pool-data-structure-and-concurrency-contract.md
    reason: >
      Object-identity tokens risk the same GDScript reference-equality pitfall already
      flagged project-wide (see affinity-data-pool.md TR-affinity-003), and produce
      unreadable diagnostic/log output (memory addresses or get_instance_id() instead of
      a stable, printable id). A monotonic int has neither problem and is consistent with
      the project's existing preference for value-type keys (see grid_occupancy_storage
      and affinity_pair_key_representation above).
    referenced_by:
      - docs/architecture/adr-0002-affinity-data-pool-data-structure-and-concurrency-contract.md
    added: 2026-08-18
    revised: ""

  - purpose: affinity_persistence_format
    status: active
    api: "format-agnostic Dictionary via to_dict()/from_dict() adapter methods and export_state()/import_state()"
    not: "Resource subclass + ResourceSaver/ResourceLoader"
    adr: docs/architecture/adr-0002-affinity-data-pool-data-structure-and-concurrency-contract.md
    reason: >
      save-system's serialization format (TR-save-001) is still an Open Question. Choosing
      Resource/.tres here would pre-commit that decision and directly conflict if
      save-system later picks JSON or a custom binary format (e.g. for hash-chain byte
      control, see TR-save-013/014). The Dictionary contract lets save-system pick any
      container format without requiring changes to this ADR or affinity-data-pool code.
    referenced_by:
      - docs/architecture/adr-0002-affinity-data-pool-data-structure-and-concurrency-contract.md
    added: 2026-08-18
    revised: ""

  - purpose: save_serialization_format
    status: active
    api: "var_to_bytes(value) -> PackedByteArray / bytes_to_var(bytes) -> Variant  # binary Variant serialization; BOTH ARE SINGLE-ARGUMENT"
    not: "Resource subclass + ResourceSaver/ResourceLoader; JSON; ALSO NOT bytes_to_var(bytes, false) — see reason"
    adr: docs/architecture/adr-0003-save-system-serialization-format-and-type-safety.md
    reason: >
      ResourceLoader.load()'s standard path has no type-filter parameter and instantiates
      any class declared in the file — Core Rules #9's deserialization type whitelist is
      "near-unenforceable" through it without a custom ResourceFormatLoader. Plain
      bytes_to_var() refuses to decode any Object/Resource instance — but that closes only
      1 of the 4 engine-unfiltered Variant types (Object/24), and only on the READ side.
      RID/23, Callable/25 and Signal/26 pass through bytes_to_var() untouched on read, and
      var_to_bytes() on WRITE silently encodes any Object/Resource as EncodedObjectAsID
      (see core-serialization.md and resource_based_save_payload below). The remaining 3
      types and the entire write side are closed only by ADR-0003's own SaveTypeGate — a
      hand-built recursive scanner run on BOTH the serialize and deserialize paths
      (mechanism 1-2), independent of and additional to anything bytes_to_var() does
      natively. CORRECTED 2026-08-25: this field previously claimed the format choice
      "eliminat[ed] the type-whitelist problem at the engine level" and that the
      version-domain question was "moot since no custom types exist at all". ADR-0003's
      own §1 refuted that framing; the registry had not been updated, so anyone reading
      only this entry got the opposite of the current decision. JSON was rejected for float
      round-trip loss (conflicts with save-system.md AC-24's tolerance assumption) and
      weaker type fidelity. Resolves save-system.md Open Question 3 and 4 — the whitelist's
      version-domain-scope question still applies (see mechanism 7), but the whitelist
      itself is SaveTypeGate's fixed, version-independent 4-code rejection set, not an
      absence of custom types.

      CALL SHAPE CORRECTED 2026-08-21 (measured, prototypes/xcheck-adr0003-2026-08-21/,
      probe F1): the global functions take EXACTLY ONE argument. There is no allow_objects
      parameter on them — Godot 4 split Godot 3's boolean into two separate functions,
      var_to_bytes/bytes_to_var (objects refused) and var_to_bytes_with_objects/
      bytes_to_var_with_objects (objects permitted). Writing bytes_to_var(bytes, false) is
      a PARSE ERROR, not a runtime issue: "Too many arguments for "bytes_to_var()" call.
      Expected at most 1 but received 2."
      ROOT CAUSE of the wrong shape, worth knowing because it will recur:
      FileAccess.get_var(allow_objects: bool = false) and FileAccess.store_var(value,
      full_objects: bool = false) DO take a second boolean — same underlying wire format,
      two different API shapes, and the FileAccess parameter is not even named the same on
      both methods. Citing FileAccess as precedent for the global functions is the trap.
      RESOLVED 2026-08-24: the divergence noted here from 2026-08-21 is closed. ADR-0003's
      2026-08-24 revision corrected all 18 two-argument call sites; registry and ADR now
      agree. (Historical note kept deliberately: this entry was CORRECT and the ADR was
      WRONG for three days, which is why the warning existed. Verified after the revision:
      zero two-argument call sites remain outside the one that quotes the historical error
      verbatim.)
    referenced_by:
      - docs/architecture/adr-0003-save-system-serialization-format-and-type-safety.md
    added: 2026-08-18
    revised: "2026-08-24"  # divergence from ADR-0003 RESOLVED — the ADR revision landed; warning removed

  - purpose: save_manifest_buffer_layout
    status: active
    api: "each data block independently serialized into its own PackedByteArray via var_to_bytes(), nested as a Dictionary value inside the outer manifest structure"
    not: "single flat var_to_bytes()/store_var() call serializing manifest metadata and all block payloads together"
    adr: docs/architecture/adr-0003-save-system-serialization-format-and-type-safety.md
    reason: >
      A flat single-call serialization would force the manifest-only read path (save-
      system.md Core Rules #5, TR-save-012) to recursively decode every block payload,
      directly violating its "does not deserialize any data block" requirement. The
      layered-buffer design lets the outer decode stop after reading manifest metadata
      (ruleset_version, block_manifest, top_level_hash) without touching any block's
      PackedByteArray content — this is also what makes Core Rules #16's locked read-order
      (top-level hash → version compare → per-block hash → type-whitelist decode →
      semantic validation) achievable at the format level rather than via extra flow-
      control logic pretending steps happen in order.
    referenced_by:
      - docs/architecture/adr-0003-save-system-serialization-format-and-type-safety.md
    added: 2026-08-18
    revised: ""

  - purpose: save_hash_algorithm
    status: active
    api: "SHA-256 via HashingContext(HashingContext.HASH_SHA256)"
    not: "CRC32, MD5, or other checksum/hash below save-system.md Core Rules #8's explicit strength requirement"
    adr: docs/architecture/adr-0003-save-system-serialization-format-and-type-safety.md
    reason: >
      save-system.md Core Rules #8 explicitly requires "SHA-256 or equivalent strength" —
      not a free architecture-stage choice. CRC32-class checksums have known collision
      blind spots for certain multi-bit-flip patterns even under an accidental-corruption
      (non-adversarial) threat model. Computation cost is negligible at the project's
      estimated save-slot size (tens of KB), so there is no performance reason to choose
      a weaker algorithm than the GDD's locked floor.
    referenced_by:
      - docs/architecture/adr-0003-save-system-serialization-format-and-type-safety.md
    added: 2026-08-18
    revised: ""

  - purpose: save_validator_registry_ownership
    status: active
    api: "SaveBlockRegistry as a dependency-injected RefCounted instance, constructed once and passed to consumers"
    not: "static class / static Dictionary holding registered validators"
    adr: docs/architecture/adr-0003-save-system-serialization-format-and-type-safety.md
    reason: >
      Consistent with the project's established DI-over-singleton preference (see
      affinity_pool_ownership above and .claude/docs/coding-standards.md) — a fresh,
      empty registry instance can be constructed per unit test to exercise "block with no
      registered validator → DATA_CORRUPTED" without needing to reset any global static
      state between test cases.
    referenced_by:
      - docs/architecture/adr-0003-save-system-serialization-format-and-type-safety.md
    added: 2026-08-18
    revised: ""

  - purpose: save_write_execution_model
    status: active
    api: "synchronous blocking write (current), routed through the SaveIOBackend abstraction (see save_io_backend_abstraction interface)"
    not: "directly implementing an unverified async write model without confirmed target-console SDK details"
    adr: docs/architecture/adr-0004-save-system-atomic-write-and-migration-execution-model.md
    reason: >
      save-system.md Core Rules #4's sync-blocking, single-thread-assumption write model is
      still provisional pending confirmation on the project's confirmed console target
      platform (technical-preferences.md: PC, Console — no specific console model named).
      Switching to async now would be an equally unverified guess in the opposite
      direction, and would directly contradict the GDD's current explicit text (a GDD
      rewrite is not this ADR's authority to make unilaterally). The SaveIOBackend boundary
      confines this open question's blast radius to one file.
    referenced_by:
      - docs/architecture/adr-0004-save-system-atomic-write-and-migration-execution-model.md
    added: 2026-08-18
    revised: ""

  - purpose: save_migration_execution_model
    status: active
    api: "stepped state machine using await scene_tree.process_frame between version-transition steps, on a plain RefCounted (SteppedMigration)"
    not: "Node + _process(delta) driving one step per frame"
    adr: docs/architecture/adr-0004-save-system-atomic-write-and-migration-execution-model.md
    reason: >
      Reuses ADR-0001's already-verified cross-frame await lifecycle pattern rather than
      introducing a new scene-tree-coupling mechanism. Consistent with the project's
      RefCounted-based, DI-friendly ownership style established in ADR-0002/0003 — avoids
      the added risk surface of dynamically attaching/detaching a Node to the scene tree
      purely to get per-frame ticks.
    referenced_by:
      - docs/architecture/adr-0004-save-system-atomic-write-and-migration-execution-model.md
    added: 2026-08-18
    revised: ""

  - purpose: save_reentrancy_release_pattern
    status: active
    api: "single-entry/single-release function structure — acquire the per-slot lock, delegate to an inner function that exhaustively returns a result for every known branch, release unconditionally as the function's last statement, no early return in between"
    not: "try/finally-style cleanup (GDScript has no such mechanism)"
    adr: docs/architecture/adr-0004-save-system-atomic-write-and-migration-execution-model.md
    reason: >
      GDScript has no exception/finally mechanism, so "unconditional release" must be
      achieved structurally. This pattern guarantees release survives any branch expressible
      as a return value; the only unguarded gap is a genuinely unclassified runtime error
      that aborts the calling function before reaching the release statement — an accepted,
      GDD-acknowledged residual risk category (save-system.md Core Rules #5 path 三), not a
      gap this pattern claims to close. See forbidden pattern
      early_return_between_lock_acquire_and_release below.
    referenced_by:
      - docs/architecture/adr-0004-save-system-atomic-write-and-migration-execution-model.md
    added: 2026-08-18
    revised: ""

  - purpose: save_repeated_failure_counter_persistence
    status: active
    api: "in-memory Dictionary[int, int], process-lifetime only"
    not: "persisting the count into the manifest"
    adr: docs/architecture/adr-0004-save-system-atomic-write-and-migration-execution-model.md
    reason: >
      save-system.md Core Rules #5 explicitly decided against persistence — this counter
      serves same-session disclosure needs only. Persisting it would make it a fifth field
      the ADR-0003 top-level integrity hash tuple must cover, a cost the GDD judges to
      exceed the benefit.
    referenced_by:
      - docs/architecture/adr-0004-save-system-atomic-write-and-migration-execution-model.md
    added: 2026-08-18
    revised: ""

  - purpose: line_of_sight_computation
    status: active
    api: "pure grid geometry (Bresenham-type), per tactical-combat-system.md Edge Cases"
    not: "PhysicsServer raycast / RayCast2D/3D nodes"
    adr: docs/architecture/adr-0001-tactical-query-atomicity-contract.md
    reason: >
      Physics-based LOS would couple logical LOS state to physics-body existence in the
      scene tree — contradicting the placement-ownership rule — and would risk violating
      AC-9's determinism guarantee (physics-step-dependent results are exactly the
      implicit state that AC forbids). Also makes the Jolt-default change (4.6) irrelevant
      to this system.
    referenced_by:
      - docs/architecture/adr-0001-tactical-query-atomicity-contract.md
    added: 2026-08-18
    revised: ""


  - purpose: cursor_input_buffering_mount_point
    status: active
    api: "_input(event) buffers into Array[InputEvent]; the _process phase drains it in TWO calls on TWO nodes — arbitrate_device_authority(events) at priority -100 (GDD step 1) and apply_buffered_navigation(events) at priority -25 on the CursorNavigationApplier child node (GDD step 3, and the buffer's last consumer, so it owns the clear()). REVISED 2026-08-19b (R4-1); the single arbitrate_frame() call no longer exists"
    not: "_unhandled_input(); per-event immediate arbitration; arbitrating inside _input()"
    adr: docs/architecture/adr-0005-cursor-device-authority-input-architecture.md
    reason: >
      CORRECTNESS REQUIREMENT, NOT STYLE (cursor-highlight-state.md Core Rules #3
      implementation constraint, escalated to a blocker in GDD round 9).
      _unhandled_input() only receives events NOT consumed by a Control's own GUI handling
      via accept_event(). A focused Control whose built-in focus navigation consumes
      ui_up / ui_down means that event NEVER REACHES the buffer at all — an OMISSION, not a
      reordering, which no buffering architecture can repair. godot-specialist CONFIRMED
      _input() is the correct mount point, and confirmed the dispatch phase order
      (_input -> GUI/accept_event -> _shortcut_input -> _unhandled_input), so an Autoload's
      _input() is structurally guaranteed to precede any accept_event() consumption.
      Arbitration sits in _process() rather than _input() because process_priority does NOT
      govern _input() dispatch order — only _process/_physics_process. The deterministic
      ordering (see cursor_actor_process_priority_ladder — 4-tier -> 5-tier on 2026-08-19
      per ADR-0005 fix F1, then 5-tier -> 6-tier on 2026-08-19b per round-4 fix R4-1) is
      therefore only achievable in the _process phase.
      REVISED 2026-08-19b (round-4 R4-1): the single arbitrate_frame() drain became two
      calls on two nodes (-100 authority, -25 buffered navigation). The mount point itself
      (_input(), never _unhandled_input()) is UNCHANGED — only what the _process phase does
      with the buffer changed.
    referenced_by:
      - docs/architecture/adr-0005-cursor-device-authority-input-architecture.md
    added: 2026-08-18
    revised: "2026-08-19b"

  - purpose: cursor_device_classification
    status: active
    api: "match on InputEvent SUBCLASS (InputEventKey / InputEventJoypadButton / InputEventJoypadMotion -> KEYBOARD_GAMEPAD; InputEventMouseMotion / InputEventMouseButton -> MOUSE)"
    not: "event.device / any device-ID based classification"
    adr: docs/architecture/adr-0005-cursor-device-authority-input-architecture.md
    reason: >
      Two-layer mechanism (cursor-highlight-state.md Core Rules #3): the ui_* action is the
      AUTHORITY GATE (an event mapping to no ui_* action is not grounds for an authority
      shift); the InputEvent subclass is the CLASSIFICATION MEANS inside that gate.
      Reading the subclass instead of the device ID gives this system STRUCTURAL IMMUNITY to
      Godot 4.7's keyboard/mouse device-ID renumbering (breaking-changes.md 4.6->4.7) —
      confirmed by godot-specialist in the round-1 /architecture-review.
      Also sidesteps the -1 sentinel trap (InputEvent.device can return -1 for some
      synthetic events, GDD round 11). DOWNSTREAM WARNING: anything reading the device ID
      for debug/logging must handle -1.
      KNOWN UNDEFINED PATH: ui_* actions synthesised via Input.action_press() have no
      backing InputEvent to classify; per GDD guidance this does NOT change current
      authority, pending a real downstream need.
    referenced_by:
      - docs/architecture/adr-0005-cursor-device-authority-input-architecture.md
    added: 2026-08-18
    revised: ""

  - purpose: cursor_actor_process_priority_ladder
    status: active
    api: "process_priority, SIX actors (REVISED 2026-08-19b, round-4 R4-1) — (1) device-authority resolution, CursorStateHost Autoload, arbitrate_device_authority() = -100 [GDD step 1]; (2) caller active retag, mark_pending_reresolve()/set_target() for non-ui_*-triggered game-semantic events = -60 (REVISED 2026-08-19c, round-5 R5-2: reference value moved from -50, and the permitted range is the OPEN interval -100 < x < -25 — both endpoints excluded) [GDD step 2]; (3) buffered navigation-class write, CursorNavigationApplier child node, apply_buffered_navigation() + buffer clear = -25 [GDD step 3]; (4) registered surfaces = 0; (5) global visual layer (incl. mechanism 13a unregistered-surface hover check) = 50; (6) downstream readers INCLUDING confirm-action interpretation = 100 [GDD step 4]. Actors 4 and 5 are pure readers and are not part of the GDD four-step sequence"
    not: "relying on scene-tree order; relying on _input()/_unhandled_input() dispatch order (process_priority does not govern either); interpreting confirm-class ui_* actions outside _process(); calling caller-retag writes directly from _physics_process() (process_priority orders the _process chain and the _physics_process chain SEPARATELY — no cross-chain guarantee); USING call_deferred() TO DEFER A RETAG INTO _process() (round-4 R4-6 — flush timing relative to the _process chain is unverified; see forbidden pattern call_deferred_for_cursor_retarget_deferral); FUSING device-authority resolution and buffered navigation write into one call (round-4 R4-1 — that is exactly what produced the 1&3 -> 2 -> 4 ordering the GDD forbids); PUTTING A DUAL-ROLE (2)+(6) SYSTEM ON ONE NODE (round-4 R4-7; see forbidden pattern single_node_for_nonadjacent_cursor_actor_roles); relying on CanvasLayer.layer for update ordering"
    adr: docs/architecture/adr-0005-cursor-device-authority-input-architecture.md
    reason: >
      REVISED 2026-08-19 (ADR-0005 fix F1, BLOCKING). OLD VALUE (round-2 architecture-review
      FAIL cause; round-3 architecture-review found this table described NODE RENDER UPDATE
      ORDER, not GDD Core Rules #2's mandated 4-step commit order — arbiter=-100, registered
      surfaces=0, global visual=50, downstream readers=100, with NO actor at all for "caller
      active retag" and no rule for where confirm-action interpretation must live): the old
