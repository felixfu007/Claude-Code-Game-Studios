# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: node_tree_derived_occupancy
    status: active
    description: >
      Never derive occupied(tile) by querying whether a unit object exists at that
      coordinate in the scene/node tree. Use the logical Dictionary only.
    why: >
      queue_free() defers actual node removal to end-of-frame. A unit that dies at
      settlement step 4 still hangs in the scene tree during that same settlement step,
      so a node-tree-derived occupancy check reports the tile as still occupied —
      directly violating tactical-combat-system.md AC-7(c)'s same-settlement-step
      release requirement. This is stable engine behaviour, not a version quirk, which
      is exactly why it is easy to miss.
    adr: docs/architecture/adr-0001-tactical-query-atomicity-contract.md
    added: 2026-08-18

  - pattern: animation_driven_logical_state
    status: active
    description: >
      Never drive logical state updates (occupancy, HP, action flags) from animation or
      Tween completion, and never read visual/animation state as an input to any rule
      decision. Logical state is the sole authority.
    why: >
      Binding logical position to a Tween's finished signal makes every query during the
      animation (potentially hundreds of ms) read stale occupancy. Conversely, the death
      fade-out is cosmetic — overlays must be authoritative over it, not wait for it.
      See tactical-combat-system.md Core Rules #11.
    adr: docs/architecture/adr-0001-tactical-query-atomicity-contract.md
    added: 2026-08-18

  - pattern: deferred_calls_in_settlement_path
    status: active
    description: >
      Within the settlement step, any call that mutates occupied or board_version must
      not go through call_deferred() or a CONNECT_DEFERRED signal connection.
    why: >
      Godot's deferred mechanism reschedules the call to a later safe point in the frame
      rather than executing it synchronously — effectively injecting a yield point into
      the middle of a settlement step that is contractually atomic. Unlike an accidental
      await, this leaves NO 'await' keyword at the call site, so code review cannot catch
      it by searching. Must be an explicit review checklist item.
    adr: docs/architecture/adr-0001-tactical-query-atomicity-contract.md
    added: 2026-08-18

  - pattern: returning_internal_container_references
    status: active
    description: >
      A query result must never carry a reference to Board's internal storage — every
      container field must be newly allocated during the computation.
    why: >
      Dictionary/Array are reference types in GDScript. If a result holds a reference to
      board's live occupancy, then even when the version stamp correctly marks the result
      stale, a caller that bypasses is_stale() sees retroactively mutated data. The
      version-stamp mechanism cannot defend this bypass — it governs WHICH data to use,
      not whether that data is a shared mutable object.
    adr: docs/architecture/adr-0001-tactical-query-atomicity-contract.md
    added: 2026-08-18

  - pattern: relying_on_container_iteration_order
    status: active
    description: >
      Never treat Dictionary/Array native iteration order as a stable output ordering.
      Consumers needing a stable sequence must explicitly sort by a fixed key (e.g. y
      then x).
    why: >
      Godot Dictionary preserves insertion order but is not key-sorted; two semantically
      identical sets computed via different code paths can have different insertion
      orders. This is why tactical-combat-system.md AC-9 asserts SET equality rather than
      sequence equality for set-valued outputs — sequence comparison would produce false
      failures.
    adr: docs/architecture/adr-0001-tactical-query-atomicity-contract.md
    added: 2026-08-18

  - pattern: autoload_singleton_for_testable_data_layers
    status: active
    description: >
      Data-layer systems that need extensive unit-test coverage of edge cases (validation
      rules, invariant checks) must not be implemented as Autoload singletons. Use a
      dependency-injected plain instance instead.
    why: >
      .claude/docs/coding-standards.md requires "dependency injection over singletons"
      for testability. Autoload forces every test case to reset global state before and
      after running to stay isolated; a DI instance can be freshly constructed per test
      with no scene-tree dependency. affinity-data-pool.md's Acceptance Criteria section
      alone requires dozens of independent, deterministic edge-case tests — Autoload would
      make each one carry global-state cleanup boilerplate.
    adr: docs/architecture/adr-0002-affinity-data-pool-data-structure-and-concurrency-contract.md
    added: 2026-08-18

  - pattern: mutable_container_as_dictionary_key
    status: active
    description: >
      Never use a mutable container (Array, Dictionary) as a Dictionary key, even though
      GDScript supports content-based hashing/equality for them. Use an enum, int, String,
      or other immutable value type instead — construct one via a canonical-normalization
      helper function if the natural key shape is a composite (e.g. an unordered pair of
      entities).
    why: >
      If the same Array/Dictionary instance used as a key is later mutated through any
      reference to it, the key's hash silently changes underneath the containing
      Dictionary, corrupting its hash bucket — a bug class that reproduces the reference-
      equality/mutability trap already flagged project-wide for GDScript (see
      affinity-data-pool.md TR-affinity-003), just via a different container.
    adr: docs/architecture/adr-0002-affinity-data-pool-data-structure-and-concurrency-contract.md
    added: 2026-08-18

  - pattern: enum_value_positional_string_conversion
    status: active
    description: >
      Never convert an enum value to its string name via positional indexing (e.g.
      `EnumName.keys()[value]`). Use `EnumName.find_key(value)` for value→name lookup and
      `EnumName[name_string]` (guarded by a validity check) for name→value lookup.
    why: >
      GDScript enums are runtime Dictionary-like objects; `find_key()`/`enum[name]` do
      value-based/key-based lookup that stays correct even if enum members are ever
      assigned non-contiguous or reordered underlying int values. Positional `keys()[value]`
      indexing silently breaks the moment that assumption stops holding — a risk directly
      relevant to any persisted enum (see affinity-data-pool.md TR-affinity-018's
      string-name persistence requirement, which this pattern serves).
    adr: docs/architecture/adr-0002-affinity-data-pool-data-structure-and-concurrency-contract.md
    added: 2026-08-18

  - pattern: resource_based_save_payload
    status: active
    description: >
      Never use a Resource subclass to hold data that must pass through the save system's
      serialization path. Provide a plain Dictionary (via a to_dict()/from_dict()-style
      adapter, see affinity-data-pool.md's pattern) as the persisted representation
      instead, even if the same data is held as a Resource in memory during gameplay.
    why: >
      save-system.md's chosen serialization mechanism (plain var_to_bytes()/bytes_to_var(),
      see save_serialization_format above) refuses to DECODE any Object/Resource-derived
      instance — this is ONE LAYER of the project's type-whitelist security argument, not
      the entire basis of it (CORRECTED 2026-08-25): bytes_to_var() alone closes only
      Object/24 and only on the read side; RID/Callable/Signal and the whole write side are
      closed by ADR-0003's separate SaveTypeGate scan (see save_serialization_format above)
      (save-system.md Core Rules #9). A future system (e.g. the not-yet-designed
      living-board terrain-evolution system, which game-concept.md already flags as likely
      to use Resource subclasses for gameplay convenience) that hands a raw Resource to the
      save system's write path reintroduces the exact type-instantiation attack surface
      this format choice was picked to avoid.

      🔴 CORRECTED 2026-08-21 — THE FAILURE DIRECTION WAS WRONG, AND WRONG THE DANGEROUS
      WAY. This field previously read "would fail to serialize at all". Measured
      (prototypes/xcheck-adr0003-2026-08-21/, probe F2-f and probe G-2a/b/c; independently
      reproduced by prototypes/save-format-skeleton-2026-08-21/): the WRITE side does NOT
      fail. Plain var_to_bytes() accepts any Object/Resource silently — no error, no
      rejection — and encodes it as an EncodedObjectAsID (4-byte type code + 8-byte
      ObjectID). Built-in RefCounted, custom class_name subclasses, and both built-in and
      custom Resource all behave identically. Reading those bytes back yields an
      EncodedObjectAsID whose fields are ALL null: the payload data is gone, silently, with
      no failure anywhere in the round trip. The loud refusal only occurs on the read side
      and only for bytes produced by the _with_objects variant.
      WHY THIS MATTERS FOR THIS BAN: the old wording implied a loud engine-level safety net
      catching the mistake at write time. There is none. This pattern must be enforced by
      discipline plus a write-side type gate, and the ban is therefore STRONGER than the
      original reasoning suggested, not weaker.
      Also note the recovered ObjectID is not inert: within the same process
      instance_from_id() resurrects the original object with all fields intact.
    adr: docs/architecture/adr-0003-save-system-serialization-format-and-type-safety.md
    added: 2026-08-18
    revised: "2026-08-21d"  # why: failure-direction corrected (measured) — write side succeeds silently

  - pattern: early_return_between_lock_acquire_and_release
    status: active
    description: >
      Never place a `return` statement between acquiring a per-resource reentrancy lock
      and its matching unconditional release. Structure the guarded logic as a single
      inner call that exhaustively returns a result for every known branch, with the
      acquire/release pair in the outer function containing no other exit point.
    why: >
      GDScript has no try/finally or exception-unwinding mechanism, so "release must
      happen unconditionally" cannot be enforced by the language — it can only be
      guaranteed by never giving the function a code path that skips the release
      statement. save-system.md Core Rules #5's R13 finding demonstrates the concrete
      cost of getting this wrong: a leaked per-slot lock (distinct from and more severe
      than the affinity-data-pool token leak, which has a timeout fallback) silently
      rejects all subsequent autosaves for that slot as a non-error "busy" result, with
      no player-visible failure and no automatic recovery.
    adr: docs/architecture/adr-0004-save-system-atomic-write-and-migration-execution-model.md
    added: 2026-08-18

  # ─── 專案級身分/範圍裁決(來源為 game-concept.md,無專屬 ADR)────────────────
  # 以下 3 項的 adr: 欄為 none —— 它們不是某一份 ADR 的推論,而是 game-concept.md
  # 層級的專案身分/範圍裁決,約束所有現有與未來的 ADR。由 /architecture-review
  # 登記(檔頭的 WRITTEN BY 慣例例外),因為兩輪架構審查皆發現它們缺席,而等一份
  # 「專屬 ADR」才登記等於讓約束在無人看守的狀態下繼續存在。
  # 未來若有 ADR 正式承接其中任一項,把 adr: 改為該 ADR 路徑並保留 gdd: 欄。

  - pattern: rng_in_combat_settlement
    status: active
    description: >
      No RNG anywhere on the combat settlement path — no dice rolls, no random events,
      no probabilistic outcomes deciding combat results. Also no probability-driven
      permadeath.
    why: >
      game-concept.md 支柱一 ("核心戰鬥不依賴隨機判定"), 支柱三 ("確定性代價,而非隨機
      懲罰") and 反支柱 ("不會有隨機骰子/隨機事件決定戰鬥結果" / "不會有靠機率造成的
      永久角色死亡") make this an identity-level decision, not a tuning preference. It is
      also a hard prerequisite for the determinism contracts in tactical-combat-system.md
      (TR-tactical-022) and for the A/B-comparable settlement required by TR-concept-013.
      THE ONE SANCTIONED EXCEPTION, which is not on the settlement path: the affinity
      dialogue card's FACE is random while its DEAL RHYTHM is fixed (game-concept.md
      第三輪 creative-director 裁決, 2026-07-29) — randomness in what is OFFERED to the
      player, never in how a settlement RESOLVES. An implementer who reads only the ban
      will collide with that ruling and not know which to trust; that is why it is
      spelled out here.
    adr: none — 專案級身分裁決,不源自任何單一 ADR
    gdd: design/gdd/game-concept.md
    tr: TR-concept-014
    registered_by: /architecture-review 2026-08-18 (round 2)
    added: 2026-08-18

  - pattern: networking_features
    status: active
    description: >
      No networking, multiplayer, or online features of any kind. Single-player only.
    why: >
      game-concept.md 玩家人數 = 單人, 連線需求 = 無(單機遊戲). Registering this keeps a
      future ADR from casually introducing a networked assumption (leaderboards, cloud
      state authority, telemetry-as-dependency) that would invalidate the single-threaded,
      sync-blocking save model in ADR-0004. Note this is distinct from TR-save-030's
      unresolved Steam Cloud question — cloud SAVE SYNC is a platform-provided file-level
      service, not a networking feature of this game.
    adr: none — 專案級範圍裁決,不源自任何單一 ADR
    gdd: design/gdd/game-concept.md
    tr: TR-concept-012
    registered_by: /architecture-review 2026-08-18 (round 2)
    added: 2026-08-18

  - pattern: procedural_terrain_generation
    status: active
    description: >
      Board terrain and its evolution are hand-authored and story-triggered. Never
      generate terrain procedurally or randomly.
    why: >
      game-concept.md 程序化系統 = 無明確程序化生成需求(棋盤演變為手工設計的劇情觸發,
      而非隨機生成). This is what makes the 5 hand-built MVP levels measurable against the
      4 spatial metrics (TR-concept-011), and what lets the living-board terrain evolution
      be a save-migration problem (TR-concept-001/002) rather than a seed-reproducibility
      problem.
    adr: none — 專案級範圍裁決,不源自任何單一 ADR
    gdd: design/gdd/game-concept.md
    tr: TR-concept-012
    registered_by: /architecture-review 2026-08-18 (round 2)
    added: 2026-08-18


  - pattern: logic_in_cursor_autoload_shell
    status: active
    description: >
      CursorStateHost (the Autoload) must stay a pure lifetime/mount shell. Never put state
      fields or arbitration logic on it — every public method is a one-line forward to the
      dependency-injected CursorState instance.
    why: >
      This shell is the ONLY reason ADR-0005 does not need an exception to
      autoload_singleton_for_testable_data_layers (ADR-0002). cursor-highlight-state.md has
      66+ Acceptance Criteria, nearly all of them pure-logic edge cases (state-machine
      transitions, same-frame arbitration, race guards, four reset trigger points). They are
      testable via CursorState.new() with no scene tree and no global-state cleanup ONLY as
      long as the logic lives in CursorState. Move any decision into the shell and every one
      of those tests reacquires global-state cleanup boilerplate — which is exactly the cost
      the ADR-0002 ban exists to prevent. Detection signal: a unit test that suddenly needs
      add_child() or a global reset means logic has leaked into the shell.
    adr: docs/architecture/adr-0005-cursor-device-authority-input-architecture.md
    added: 2026-08-18

  - pattern: unhandled_input_for_device_authority
    status: active
    description: >
      Never mount the cursor system's device-authority arbitration buffer on
      _unhandled_input(). It must be _input().
    why: >
      _unhandled_input() only receives events not already consumed by a Control's GUI
      handling via accept_event(). A focused Control whose built-in focus navigation
      consumes ui_up / ui_down means that event NEVER ENTERS the buffer — an OMISSION, not a
      reordering, and no buffering architecture can repair an event that never arrived. This
      would falsify cursor-highlight-state.md's core "100% deterministic, testable" claim.
      Escalated to a blocker in GDD round 9; godot-specialist CONFIRMED _input() is correct
      in the round-1 /architecture-review and re-confirmed the dispatch phase order in the
      ADR-0005 Step 5.5 validation.
    adr: docs/architecture/adr-0005-cursor-device-authority-input-architecture.md
    added: 2026-08-18

  - pattern: reading_input_event_device_id
    status: active
    description: >
      Never classify an input device by InputEvent.device (or any device-ID value). Classify
      by the InputEvent SUBCLASS. Debug/logging code that does read the device ID must
      handle the -1 sentinel.
    why: >
      Godot 4.7 CHANGED keyboard/mouse device-ID numbering (breaking-changes.md 4.6->4.7:
      "Code that hardcodes device IDs will break"), and deprecated-apis.md lists "Hardcoded
      keyboard/mouse device IDs" as a forbidden pattern in its own right. Subclass-based
      classification gives structural immunity rather than version-dependent correctness.
      Additionally InputEvent.device can return -1 ("no specific device") for some synthetic
      events — a trap registered in cursor-highlight-state.md round 11 specifically as an
      ADR-authoring warning item.
    adr: docs/architecture/adr-0005-cursor-device-authority-input-architecture.md
    added: 2026-08-18

  - pattern: native_control_hover_or_focus_on_registered_surface
    status: active
    description: >
      A registered cursor surface's root Control must satisfy BOTH conditions: (1)
      focus_mode = Control.FOCUS_NONE, and (2) no built-in mouse-hover theme state — it must
      not be a Button or any node type carrying a hover StyleBox, or that StyleBox must be
      explicitly cleared. Highlight visuals read CursorState only, never any native
      focus/hover state.
    why: >
      Godot 4.6 split mouse/touch focus from keyboard/gamepad focus (dual-focus). If board
      tiles relied on native focus/hover theming, the two could render simultaneously —
      reproducing cursor-highlight-state.md's highest-risk documented failure ("two
      highlights at once"). Ruled by godot-specialist + creative-director in GDD round 4 and
      generalised to ALL hover/cursor-target surfaces in round 5.
      CONDITION (2) IS NOT REDUNDANT (godot-specialist, ADR-0005 Step 5.5): focus_mode has
      only ever governed keyboard/gamepad focus. Native mouse-hover visuals are driven by
      mouse_entered/mouse_exited plus the node's internal state machine — a SEPARATE
      PIPELINE. The 4.6 split changed which focus channels share state, NOT which property
      disables mouse hover. So focus_mode = FOCUS_NONE most likely closes only ONE of the two
      pipelines: a hover-themed root Control would draw native hover independently of all
      cursor-system logic, even when that logic is perfectly correct. Confirm via ADR-0005
      Verification Required #9 (set FOCUS_NONE on a Button, check whether hover still draws).
      SCOPE: applies to REGISTERED surfaces. Unregistered surfaces (non-modal sidebars,
      toasts) may use native focus — AC-60 says so explicitly, and directional navigation
      there may still shift device authority, which is correct because authority is global.
    adr: docs/architecture/adr-0005-cursor-device-authority-input-architecture.md
    added: 2026-08-18

  - pattern: confirm_action_read_in_unhandled_input
    status: active
    description: >
      Any downstream system that interprets a confirm-class ui_* action (e.g. ui_accept)
      against cursor-highlight-state's exposed state (is_current_target_valid(),
      get_device_authority()) must do so from that system's own _process() — never from
      _input() or _unhandled_input(), and never directly from _physics_process() without
      deferring the call into _process(). This generalizes the existing
      unhandled_input_for_device_authority pattern (which only covers this system's OWN
      _input() buffer) to every DOWNSTREAM consumer of this system's state.
    why: >
      ADR-0005 fix F1 (BLOCKING, round-3 architecture-review). GDD Core Rules #2's mandated
      4-step same-frame order is: device-authority resolution -> caller active retag call ->
      buffered navigation-class ui_* write -> buffered confirm-class ui_* read (AC-52). If a
      downstream system reads is_current_target_valid() from its own _input()/
      _unhandled_input(), that read executes BEFORE this system's _process() (priority -100)
      even starts — no process_priority number can fix this, because process_priority does
      not govern _input()/_unhandled_input() dispatch at all, only the separate _process and
      _physics_process chains. Enforcement is therefore structurally impossible for the
      engine to guarantee; this pattern exists specifically so code review has something
      concrete to check for. See api decision cursor_actor_process_priority_ladder for the
      full 5-tier ordering this pattern is part of.
    adr: docs/architecture/adr-0005-cursor-device-authority-input-architecture.md
    added: 2026-08-19

  - pattern: cursor_state_write_from_own_signal_handler
    status: active
    description: >
      Never call set_target(), mark_pending_reresolve(), handoff_before_unload(), or
      arbitrate_frame() synchronously from within a handler connected to this same system's
      own target_changed() / device_authority_changed() signals. These four calls are
      guarded by an internal _mutation_in_progress flag and will return REJECTED_REENTRANT
      (added to both SetTargetResult and MarkResult) rather than mutate state or re-emit if
      called while a mutation is already in flight. Callers needing to chain a write from
      inside a signal handler must use call_deferred() to push it to the next frame.
    why: >
      ADR-0005 fix N4. The ADR formally adopted signal push (target_changed()/
      device_authority_changed(), see interface contract cursor_state_change_signals) in
      addition to the existing process_priority-based polling, since many GDD acceptance
      criteria require "state change must be reflected immediately" rather than "reflected
      by next _process()". Godot signals dispatch SYNCHRONOUSLY in the same call stack by
      default (CONNECT_DEFERRED would break the same-frame guarantees this system depends
      on, so it is not a valid workaround) — a handler that calls back into a write method
      mid-mutation would reenter arbitrate_frame()/set_target() before the triggering call
      has finished committing its own field writes. This mirrors ADR-0001's
      settlement_in_progress reject-on-input gate for the same class of problem. This is a
      single-threaded same-stack reentrancy problem, NOT a cross-thread contention problem —
      do not reach for Mutex (ADR-0002's tool for a different problem); a plain boolean guard
      is the correct, idiomatic GDScript pattern here (godot-specialist, ADR-0005 revision
      validation).
    adr: docs/architecture/adr-0005-cursor-device-authority-input-architecture.md
    added: 2026-08-19

  - pattern: public_cursor_write_entry_calling_another
    status: active
    description: >
      Inside CursorState, one _mutation_in_progress-gated PUBLIC entry
      (arbitrate_device_authority / apply_buffered_navigation / set_target /
      mark_pending_reresolve / handoff_before_unload) calling ANOTHER public gated entry —
      most temptingly, apply_buffered_navigation() reusing set_target() to perform its
      buffered navigation write. All actual _target mutation must instead go through the
      PRIVATE, UNGATED _write_target_internal().
    why: >
      ADR-0005 round-4 fix R4-4 (HIGH, godot-specialist finding beyond the lead reviewer's
      five items). The N4 reentrancy gate was specified as covering every mutating call. But
      the arbitration path must itself write a target, and if it did so via the public
      set_target(), the flag it had already set on entry would make its own gate reject the
      call — SO THE BUFFERED NAVIGATION WRITE WOULD NEVER TAKE EFFECT, silently, in the
      normal path. The gate designed to prevent reentrancy would have deadlocked the system
      against itself. The previous ADR revision never stated whether internal writes went
      through public or private paths, leaving implementers to pick the broken option.
      Same structural reasoning as ADR-0004's single-entry/single-release per-slot lock:
      with no try/finally in GDScript, "the flag is set exactly once and cleared exactly
      once" is only guaranteeable if entries never nest.
      EXTENDED 2026-08-19c (round-5 R5-1): round 4 fixed only ONE of three sites of this
      shape. 2026-08-21: the count below is now SEVEN public entries and SIX private paths.
      handoff_before_unload() (branch 甲) was specified as "calls
      mark_pending_reresolve()" — both gated public entries, so 甲 would have been rejected
      by its own gate and the pending-reresolve mark would never have been applied.
      handoff_after_mount() (branch 乙, added in the same revision) would have hit the same
      wall had it borrowed set_target() for its validation. The rule now covers SEVEN public
      entries and SIX private paths (2026-08-21: was four); no public entry may call another, and every entry has
      a private path available so it never needs to.
    adr: docs/architecture/adr-0005-cursor-device-authority-input-architecture.md
    added: "2026-08-19b"
    revised: "2026-08-19c"

  - pattern: call_deferred_for_cursor_retarget_deferral
    status: active
    description: >
      A downstream system whose retag trigger originates in _physics_process() using
      call_deferred() to push mark_pending_reresolve()/set_target() into _process(). The
      ONLY sanctioned deferral is a plain flag, checked and executed at the top of that
      system's own _process().
    why: >
      ADR-0005 round-4 fix R4-6. The previous revision listed call_deferred() alongside the
      flag route as an equivalent option, but the two are NOT equivalent: the flush point of
      a deferred call RELATIVE TO THE _process CHAIN was never verified by this project. If
      it lands after the _process chain, or on the following frame, that frame's confirm read
      (actor 6, priority 100) happens BEFORE the retag (actor 2, priority -60) — reopening
      precisely the AC-52 ordering hole that fixes F1 and R4-1 were written to close. An
      unverified scheduling assertion must not sit inside the fix for an ordering defect.
      If someone later verifies the flush point, this pattern may be lifted — but the
      verification must happen first, in that order.
    adr: docs/architecture/adr-0005-cursor-device-authority-input-architecture.md
    added: "2026-08-19b"

  - pattern: single_node_for_nonadjacent_cursor_actor_roles
    status: active
    description: >
      A system holding TWO NON-ADJACENT roles on the cursor process_priority ladder — in
      practice actor (2) caller-active-retag at -60 and actor (6) downstream-reader /
      confirm-interpretation at 100 — implementing both on ONE node and relying on statement
      order inside a single _process() to sequence them. Such a system MUST split into two
      nodes (e.g. main node at 100 for the read role, a thin child at -60 for the retag role,
      mirroring how this system itself handles CursorNavigationApplier).
      Statement-order merging REMAINS VALID for ADJACENT roles with no other actor between.
    why: >
      ADR-0005 round-4 fix R4-7, and a PARTIAL CORRECTION of the fix direction the round-4
      report adopted. godot-specialist correctly overturned the lead reviewer's "the priority
      ladder has no solution" — process_priority governs only cross-node _process() ordering,
      never statement order inside a function, so merged roles CAN be sequenced in one node.
      But that conclusion does not hold for THIS pair: actors (3) at -25 (this system's own
      buffered navigation write) and (4) at 0 (registered surfaces) sit BETWEEN them. A
      single node at 100 defers the retag until after actor (3) — the caller's semantic
      change (e.g. unit death) loses to the navigation write, inverting GDD step 2 -> 3. A
      single node at -60 advances the confirm read to before actor (3), inverting step 3 -> 4.
      Either placement violates one leg of the four-step sequence. The tactical-combat system
      holding both roles is close to inevitable, and neither the previous actor table nor the
      architecture diagram said a word about it.
    adr: docs/architecture/adr-0005-cursor-device-authority-input-architecture.md
    added: "2026-08-19b"

  - pattern: external_access_to_cursor_reclaim_instance
    status: active
    description: >
      Any code outside CursorState holding, reading, or calling the MouseReclaimPolicy
      instance directly — including CursorStateHost calling _reclaim.reset(...), and the
      self-drawn presentation node connecting to reclaim.reset_triggered or calling
      reclaim.reclaim_progress(). CursorState owns the instance privately and exposes NO
      getter. The only legal channels are CursorState's own forwards:
      reseed_reclaim_on_focus_regained(), reclaim_progress(), and the forwarded signal
      reclaim_reset_triggered.
    why: >
      ADR-0005 round-5 fix R5-3 (MEDIUM-HIGH). The round-5 review found THREE consumers each
      assuming a DIFFERENT access path to the same instance, with no getter anywhere in the
      interface — two of the three were structurally impossible, and one of those
      (CursorStateHost picking which ResetTrigger to fire) is arbitration logic sitting in
      the Autoload shell, edging into logic_in_cursor_autoload_shell. Keeping the instance
      private also collapses the mouse-coordinate access paths from three to one:
      get_viewport().get_mouse_position() may appear EXACTLY ONCE in the project, in the line
      that constructs mouse_position_provider. This ADR repeatedly criticises discipline-only
      guarantees elsewhere; leaving the instance reachable would be the same defect.
    adr: docs/architecture/adr-0005-cursor-device-authority-input-architecture.md
    added: "2026-08-19c"

  - pattern: independent_ifs_for_cursor_target_reset_policy
    status: active
    description: >
      Implementing the two reset paths inside _write_target_internal(target, reset_policy)
      as two independent `if` statements instead of if/elif — i.e. letting UNCONDITIONAL
      (SURFACE_HANDOFF) and "target actually changed" (TARGET_CHANGED) both fire in the same
      write. The two paths are MUTUALLY EXCLUSIVE by contract.
    why: >
      ADR-0005 round-5, godot-specialist Step-5.5 finding A. Handoff branch 乙 calls with
      UNCONDITIONAL and normally DOES change the target — the common case, not an edge case.
      Two independent ifs therefore call _reclaim.reset() twice in one write, emitting
      reset_triggered with two different trigger values. Validation Criteria #15 asserts
      branch 乙 carries SURFACE_HANDOFF and not TARGET_CHANGED; with a double emission,
      whether that test passes depends on whether the subscriber reads the first or the last
      signal — an implementation detail. This is the same failure shape this ADR keeps
      hitting: the mechanism did not say "exclusive", the most natural implementation filled
      the gap, and it filled it wrong. Validation Criteria #15c (exactly one emission) is the
      automated floor.
    adr: docs/architecture/adr-0005-cursor-device-authority-input-architecture.md
    added: "2026-08-19c"

  - pattern: raw_variant_subscript_into_typed_container
    status: active
    description: >
      Two distinct violations, one per boundary. (Rule 1, keys) Using a Variant-sourced
      value — anything not narrowed through a typed parameter signature — directly as a
      subscript KEY into a typed Dictionary such as _records or _death_marks.
      (Rule 2, values) Writing into the VALUE slot of those containers from anywhere other
      than a statically typed construction inside AffinityDataPool itself
      (AffinityRecordList.new(), an internally built AffinityRecord, or an int) — in
      particular, never assigning a Variant/Object obtained from outside the system.
    why: >
      Measured on Godot 4.7.1 (2026-08-20). Rule 1: the typed-Dictionary subscript path
      does NOT enforce enum family. Dictionary[Pair,int][Character.CHARACTER_3] = 99
      succeeds silently — size=1, keys=[2], zero error output — because the container
      erases enum keys to TYPE_INT (get_typed_key_builtin() == 2). The compiler DOES
      discriminate enum families at typed assignment and typed-container assignment
      boundaries, so routing every external key through a typed parameter closes the only
      known static-checking gap. Rule 2 is a SEPARATE guarantee and must NOT be conflated
      with Rule 1 — the first draft of this revision did exactly that and Step 5.5 review
      rejected the derivation. The value slot is guarded at runtime by C++ container
      validation, whose behaviour under an export release build is UNVERIFIED (ADR-0002
      Verification Required #7). Keeping every value construction statically typed means
      layer 1 checks it at the assignment site, making the release-build question a
      defence-in-depth concern rather than a correctness dependency. Without either rule a
      wrong-typed key or value is written silently and surfaces far from the write site —
      worst case as save corruption that passes ADR-0003's two SHA-256 chains, since hashes
      verify byte integrity, not semantic validity.
    adr: docs/architecture/adr-0002-affinity-data-pool-data-structure-and-concurrency-contract.md
    added: "2026-08-20"

  - pattern: death_marks_prefill_or_unguarded_read
    status: active
    description: >
      _death_marks must never be prefilled with all Character keys, AND every read of it
      (including t_death()'s two lookups) must be guarded by .has(character) first. This is
      the exact OPPOSITE of the rule for _records, which IS prefilled and needs no guard.
    why: >
      The two containers have different key-presence semantics. For _death_marks, KEY
      PRESENCE IS THE SEMANTICS — mechanism 3 returns DUPLICATE_DEATH_NOTIFICATION when the
      character is already present. Prefilling would mark all 5 characters dead. But an
      unguarded subscript read of a missing key ABORTS THE CALLING FUNCTION (measured, probe
      A 2026-08-20), so the guard is mandatory. Registered because the asymmetry with
      _records is counter-intuitive: an implementer tidying up "for consistency" would
      prefill both and silently destroy the death semantics.
    adr: docs/architecture/adr-0002-affinity-data-pool-data-structure-and-concurrency-contract.md
    added: "2026-08-21"

  - pattern: raw_enum_name_subscript_from_untrusted_string
    status: active
    description: >
      Never write AffinityTypes.Pair[name] / Character[name] / Source[name] where name came
      from a save file, an imported data table, or any source outside this system. Always do
      an existence check first — keys().has(name) — or use find_key(value), both of which
      return cleanly. The ban is on the SHAPE ([] subscript), not merely on the input source.
    why: >
      MEASURED: a dynamically-built illegal enum-member name passed to [] is a runtime
      SCRIPT ERROR that ABORTS the calling function (probe C, 2026-08-20); a literal one is
      a Parse Error that fails the whole file. Either way validate_semantics() aborts BEFORE
      reaching its own rejection-code logic, so the structured ImportResult its contract
      promises can never be returned. Probe D (2026-08-21) measured that the SAME illegal
      name via keys().has() COMPILES AND RETURNS FALSE in both the literal and the
      runtime-built form. The .has() method call and the [] subscript therefore have
      entirely different fates — which is why the rule must name the shape. "Do not
      bare-subscript with untrusted strings" forbids a shape; "use keys().has() first"
      supplies the replacement shape. Both sentences are required; they are not two
      phrasings of one rule.
    adr: docs/architecture/adr-0002-affinity-data-pool-data-structure-and-concurrency-contract.md
    added: "2026-08-21"

  - pattern: wholesale_reassignment_of_affinity_record_list_items
    status: active
    description: >
      Never reassign AffinityRecordList's inner array as a whole (_items = <anything>). The
      only sanctioned write path is append(record: AffinityRecord). No method returning
      _items itself may be added.
    why: >
      Round 7 (R7E-12) found that the AffinityRecordList wrapper had MOVED the "not
      enforced" weakness that Alternative 7 was rejected for — from the Dictionary value
      slot to a public mutable field. The declarative initialiser only guarantees the
      INITIAL value. Privatising to _items narrows the sanctioned write path to one typed
      signature, so any wholesale assignment becomes a visible convention violation that
      lint can find — whereas assigning to a public items field is completely normal usage
      and indistinguishable from correct code. HONEST LIMIT: GDScript has NO real private
      members; the underscore is convention, so this is NOT a structural guarantee and
      ADR-0002 explicitly does not claim it meets the "structure over discipline" bar it
      used to reject Alternative 7.
    adr: docs/architecture/adr-0002-affinity-data-pool-data-structure-and-concurrency-contract.md
    added: "2026-08-21"

  - pattern: unvalidated_character_into_pair_of
    status: active
    description: >
      Never call AffinityTypes.pair_of(a, b) without first validating both arguments via
      AffinityTypes.is_valid_character(). pair_of()'s behaviour on an illegal ordinal is
      undefined.
    why: >
      pair_of() is the 8th entry taking enum-typed parameters, and the only one that CANNOT
      be given a rejection code: it returns a bare Pair, which cannot be null. Rejected
      alternatives: returning Variant (contradicts the same revision's elimination of all
      Variant returns), adding Pair.INVALID = -1 (would make values().has(-1) report legal
      and defeat the ordinal validators), and push_error() plus a sentinel Pair (violates
      ADR-0002's Constraints and silently produces a wrong pair — exactly the R7-P2 failure
      mode). Caller obligation plus this ban is therefore the only remaining option.
      ADR-0002 explicitly does NOT claim entry 8 is protected to the same standard as
      entries 1-7 — this is a documented obligation, not a structural guarantee.
    adr: docs/architecture/adr-0002-affinity-data-pool-data-structure-and-concurrency-contract.md
    added: "2026-08-21"

  - pattern: abstract_func_with_body
    status: active
    description: >
      An @abstract function must be declared as a BARE SIGNATURE — no colon, no body.
      "@abstract func f() -> T: pass" is a compile-time Parse Error that blocks the whole file.
    why: >
      MEASURED (2026-08-20, prototypes/engine-verification-spike-2026-08-20): the colon+pass form
      is "Parse Error: An abstract function cannot have a body." The bare signature is legal for
      EIGHT return types, each with its own [COMPILED OK] evidence line: Array[T]/bool/float/
      void/Vector2 (2026-08-20 batch) plus Variant/String/PackedByteArray (2026-08-21 probe E).
      An @abstract class may hold a signal alongside several @abstract funcs. A missing override
      is a COMPILE error, but the message names only ONE method and covers the rest with "and
      other inherited abstract methods" — it does NOT enumerate them, so a second compile may be
      needed to see the next one. Constructing an @abstract class via a LITERAL ClassName.new()
      is likewise a COMPILE-time "Parse Error: Cannot construct abstract class" — it fires even
      on a branch that never executes. Indirect construction paths (Object.new()+set_script(),
      load("...").new(), ClassDB/ResourceLoader) are NOT verified in either direction; do not
      state or rely on "an abstract class cannot be instantiated" without that qualifier.
      REGISTERED PROJECT-WIDE, not under one ADR, because it existed in TWO documents and the
      root cause was a THIRD: docs/engine-reference/godot/current-best-practices.md carried a
      WRONG example (colon+pass, with a "# Subclasses MUST override" comment that made it read
      as deliberately verified). Round 3 upgraded @abstract from "impression" to "verified" by
      comparing against that wrong example — that upgrade was VOID. The example was corrected
      2026-08-20; ADR-0005's 8 occurrences were removed 2026-08-21 together with the sentence
      that instructed implementers to copy the wrong form; ADR-0004's 5 occurrences and its own
      instruction sentence were removed the same day. BOTH DOCUMENTS ARE NOW CLOSED (2026-08-21).
      The line numbers 80/83/86/89/92 previously recorded here were 2026-08-18 draft positions;
      deleting those 5 lines shifted every line below them, so specific numbers are deliberately
      NOT retained — a stale line reference sitting under a "CLOSED" note reads as though it
      still matches the file. Recorded here rather than inside either ADR because a cross-ADR
      TODO written in another ADR's prose silently expires when that ADR is fixed independently
      (the C6/C7 failure shape). This registry entry is the single non-expiring authority for
      that fact, and the 2026-08-21 ADR-0004 fix PROVED the design works: closing ADR-0004
      required changing not one word of ADR-0005. The entry remains active as a forward-looking
      ban — any future @abstract declaration in this project must be a bare signature.
    adr: none
    verified_by: >
      docs/engine-reference/godot/current-best-practices.md (corrected 2026-08-20) +
      docs/architecture/architecture-review-2026-08-20-round7.md section 7.5 +
      prototypes/engine-verification-spike-2026-08-20/ (probes c1_bare_*.gd, finding F-11) +
      prototypes/xcheck-round7-2026-08-20/logs/probeE-unfiltered.txt (probe E, 2026-08-21:
      Variant/String/PackedByteArray return types, the verbatim ADR-0004 mechanism-one shape,
      a fully-implementing concrete subclass with polymorphic dispatch through the abstract
      base type, and the compile-time rejection of a literal ClassName.new())
    revised: "2026-08-21c"
    referenced_by:
      - docs/architecture/adr-0005-cursor-device-authority-input-architecture.md
      - docs/architecture/adr-0004-save-system-atomic-write-and-migration-execution-model.md
    added: "2026-08-21"

  - pattern: silent_freeze_fallback_for_invalid_provider
    status: active
    description: >
      When an injected Callable provider becomes invalid, never fall back to "return the last
      known value" on a path that is polled every frame. Escalate to a system-level degraded
      state: skip the dependent path entirely, push_error() ONCE (guarded by a bool), keep the
      diagnostic counter.
    why: >
      R6-11: MouseReclaimPolicy.evaluate() computes P.distance_to(_seed). With a stale-coordinate
      fallback the steady state is necessarily _seed == P, so net displacement is permanently 0 —
      mouse-side reclaim is DEAD and COMPLETELY SILENT in shipping builds (the diagnostic counter
      is QA-only). The other branch (stale P already past the threshold) converges to the same
      place: NAVIGATION always wins the fixed ladder, the player presses a direction key, trigger
      (d) VETOED_SAME_FRAME fires reset(P, ...) and pulls _seed back to P. This contradicts the
      ADR's own "never silent" stance and its rule that fail-safe must lean toward the hard
      requirement — the very same revision had just used that argument to invert mechanism 13-2
      into a whitelist. Failure direction must flip from "silent freeze" to "loud disable".
      NOTE the interface half (Step 5.5 B-1): the coordinate getter's -> Vector2 signature gives
      the caller NO channel to know the value is a fallback, so the check must sit in the CALLER
      (is_valid() on the provider, before requesting a coordinate). Declaring the behaviour
      without wiring the interface is the R6-6 / R5-1 defect shape.
      push_error() is NOT assert(): assert() is stripped in release builds by design, push_error()
      is an ordinary runtime call unaffected by build type (impression-high-confidence, NOT
      verified by this project — engine reference has zero hits).
    adr: docs/architecture/adr-0005-cursor-device-authority-input-architecture.md
    added: "2026-08-21"

  - pattern: fileaccess_store_var_on_save_path
    status: active
    description: "The save read/write path must never call FileAccess.store_var() or
      FileAccess.get_var(). Save bytes go through store_buffer()/get_buffer() as opaque
      bytes; Variant encode/decode happens only in the two functions ADR-0003 defines."
    why: "Unlike the four global functions, FileAccess.get_var(allow_objects: bool = false)
      and FileAccess.store_var(value, full_objects: bool = false) DO take a second boolean.
      Defaults are safe, but a single get_var(true) bypasses ADR-0003's entire type-safety
      argument on one line that looks like completely normal Godot usage. This asymmetry
      between the two API families is also the ROOT CAUSE of ADR-0003's 18 non-compiling
      call sites (2026-08-21 probe F): citing FileAccess as precedent for the global
      functions is the trap — and the two FileAccess methods do not even name that second
      parameter the same way (allow_objects vs full_objects). NOTE: whether FileAccess and
      the global functions share the same Variant wire format is an INFERENCE carried over
      from an older draft, NOT measured by this project; the ban does not depend on it."
    adr: docs/architecture/adr-0003-save-system-serialization-format-and-type-safety.md
    verified_by: prototypes/xcheck-adr0003-2026-08-21/
    added: "2026-08-24"

  - pattern: hash_compare_without_length_check
    status: active
    description: "Hash comparison must go through hash_matches(), which checks length
      before content. Never compare two hash PackedByteArrays with == directly."
    why: "When BOTH sides fail, each is an empty PackedByteArray, and empty == empty is
      TRUE — a double failure reads as a successful match. Measured: a second finish() on
      a used HashingContext returns an EMPTY PackedByteArray (not an error). Two experts
      (engine and GDScript domains) independently wrote the same length-first function for
      the same reason during the 2026-08-24 revision — two-track convergence."
    adr: docs/architecture/adr-0003-save-system-serialization-format-and-type-safety.md
    verified_by: docs/engine-reference/godot/modules/core-serialization.md
    added: "2026-08-24"

  - pattern: gate_recursion_calling_walk_body
    status: active
    description: "Inside SaveTypeGate, every recursive call must go to _walk() (the thin
      shell that performs the depth check), never to _walk_body(). The depth check must
      remain the first executable statement of _walk()."
    why: "SaveTypeGate returns a field-bearing GateResult rather than a bool. That is safe
      ONLY because the depth check runs before any recursion, capping the stack at 66
      frames against an inferred ~1024-frame GDScript limit. If recursion bypasses the
      shell, a stack overflow unwinds returning null, the caller reads a property on null,
      and the calling function aborts silently. CRITICAL: the existing depth tests (10/62/
      63/64/65/100) CANNOT detect this regression — 100 is far below the real stack limit,
      so a reordered check still looks like it works. Only the deliberate 3000-deep
      regression test catches it, and its second assertion (no Stack overflow in stderr)
      requires CI-level stderr checking, registered as an implementation-phase item."
    adr: docs/architecture/adr-0003-save-system-serialization-format-and-type-safety.md
    verified_by: prototypes/save-format-skeleton-2026-08-21/
    added: "2026-08-24"

  - pattern: unowned_save_assembly_layer
    status: open_gap
    description: "OPEN GAP, not a ban. No ADR currently claims the assembly layer that
      turns per-block payloads into a complete save envelope (calling serialize_block()
      per block, computing the two-level hash chain, building block_manifest, calling
      serialize_manifest()). ADR-0003's architecture diagram draws the step but defines no
      Key Interface for it; ADR-0004 states it only replaces bytes on disk and does not
      cover how the bytes are assembled."
    why: "Two consequences, and the second is a security issue. (1) COMPLETENESS: nothing
      specifies how a save file is assembled. (2) SECURITY: ADR-0004 mechanism 7 Phase B
      takes migrated_data as a Dictionary while write_temp() takes PackedByteArray, so a
      serialization step must exist in between — but NO ADR says which function it calls.
      Through SaveFormat.serialize_manifest() the new write-side gate blocks dangerous
      types; through a bare var_to_bytes() nothing blocks them. This is the SECOND
      occurrence of gap C4 (2026-08-18 settled write_temp()'s underlying call for the
      normal write path; the migration write-back path was never settled) and the
      2026-08-24 revision is what first turned it into a security issue, because before
      it there was no write-side gate at all. RELATED: ADR-0004 mechanism 5 applies only
      structural post-conditions per migration step and semantic validation only at the
      final step — type checking runs zero times, so a buggy migration function can inject
      a Callable/RID/Signal/Object mid-chain. ADJUDICATION (TD-ADR 2026-08-24): these are
      NOT two gaps. The migration one is the assembly layer's instance on the migration
      path. Claiming the assembly layer AND requiring both paths (normal write, migration
      write-back) to go through the same entry point closes both with ONE owner and no new
      seam. Do not fix them separately. ALSO OPEN in ADR-0004: mechanism-7 path four
      promises 'integrity/type check WITHOUT deserializing payload' — structurally
      impossible now, since RID/Callable/Signal are only detectable on a decoded
      Dictionary; and line 328 still says 'type-whitelist DECODING', which invites
      implementers to skip the separate gate scan."
    adr: docs/architecture/adr-0003-save-system-serialization-format-and-type-safety.md
    also_affects: docs/architecture/adr-0004-save-system-atomic-write-and-migration-execution-model.md
    verified_by: prototypes/save-format-skeleton-2026-08-21/
    added: "2026-08-24"
