      the self-drawn carrier is still the superior option and this ADR needs no revision.
      Marginal cost is near zero because the global CanvasLayer already exists for the
      per-device idle indicator (TR-cursor-016).
      AC-31'S ASSERTION TARGET IS THEREFORE FIXED: the self-drawn node's visible /
      modulate.a — NOT Input.mouse_mode, which degenerates to vacuously true for
      progressive feedback under this design (the GDD predicted this correctly).
      Input.mouse_mode assertions remain valid for the binary suppression of the native
      pointer (Core Rules #5); the two are distinct validation targets.
      REVISED 2026-08-19 (ADR-0005 fix F3, F4, N3). OLD VALUE: modulate.a directly bound to
      reclaim_progress() (the round-3 architecture-review found this necessarily violates
      AC-41 for reset triggers a/b/c, which must converge over
      reclaim_visual_convergence_max_frames rather than snap — direct binding snaps every
      time). NEW VALUE: an indirection layer (_presented_alpha) that converges toward
      reclaim_progress() via move_toward(), snapping only on trigger (d) — see interface
      contract mouse_reclaim_reset_triggered_signal for how the presentation node learns
      which trigger fired. The mechanism-15 diagnostic field
      diagnostic_reclaim_progress_history must sample _presented_alpha (the presented
      value), NOT reclaim_progress() (the judgment value) — sampling the wrong one was
      exactly the F4 defect (measuring the wrong instrument for the
      reclaim_visual_convergence_max_frames bound).
