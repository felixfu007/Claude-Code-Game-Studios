      immediately above is WRONG and is kept only as a record. Fusing steps 1 and 3 yields
      an actual order of 1&3 -> 2 -> 4, the reverse of the GDD's explicit 1 -> 2 -> 3 -> 4,
      and the GDD calls that ordering direction "a hard behavioural requirement". The old
      defence addressed OBSERVABILITY but not PRECEDENCE. Concrete difference: when a caller
      set_target(A) (step 2) and a buffered ui_right navigation write (step 3) occur in the
      same frame, last-writer-wins — under the fused order the caller retag overwrites the
      navigation write, so THE PLAYER'S DIRECTION-KEY INPUT FOR THAT FRAME IS SWALLOWED
      WHOLE; under the GDD order the navigation write computes on top of the retag and wins.
      Also, AC-52's stated verification method is "code review first — confirm the node
      execution order matches the four-step sequence", which the fused version fails.
      NEW VALUE (6 tiers): step 3 moves out of -100 onto a dedicated CursorNavigationApplier
      child node at -25, strictly between the caller-retag tier (-60, see R5-2 below) and registered
      surfaces (0). Two nodes are structurally required: process_priority is a PER-NODE
      property, so one node cannot occupy both -100 and -25, and an EXTERNAL system's
      execution (-60) sits between them. Buffer-clear responsibility moves to -25 (the
      frame's last consumer).
      Lower process_priority runs first, so the arbiter necessarily updates the three
      top-level fields before ANY reader runs — making
      max_handoff_visual_latency_frames = 1 (GDD-locked) a SAME-FRAME guarantee rather than
      a barely-met bound.
