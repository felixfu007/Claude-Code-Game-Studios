      is a WINDOW-GLOBAL switch, but cursor-highlight-state.md AC-60 explicitly carves
      unregistered surfaces (e.g. a non-modal settings sidebar) out of this system's
      jurisdiction and permits them to use native hover. Without this exception, a player
      with gamepad authority who tries to use the mouse on an allowed unregistered surface
      sees the sidebar's own hover style render with no visible cursor at all to explain why
      hovering worked — Core Rules #5's global hide and AC-60's carve-out were never
      reconciled before this fix.
      THIS IS A TECHNICAL RESOLUTION, NOT A GDD OVERRIDE: it is presented as consistent with
      AC-60's carve-out (restoring visibility on jurisdiction the GDD already excludes), not
      as a reinterpretation of Core Rules #5. If creative-director or the user judges this
      still conflicts with Core Rules #5's intent, the GDD must be revised and this mechanism
      adjusted or removed accordingly — ADR-0005 does not claim authority to settle this
      design question unilaterally.
      Runs on the same CanvasLayer node/single _process() as the mechanism-13 presentation
      smoother (not a separate node) specifically to avoid same-priority (=50) sibling
      ordering being undefined.
      REVISED 2026-08-19c (round-5 R5-6 MEDIUM-HIGH + Step-5.5 finding F): the denylist form
      had two independent failure paths, BOTH ending in "native pointer wrongly shown",
      i.e. a direct violation of Core Rules #5. (R5-6) gui_get_hovered_control() does not
      return MOUSE_FILTER_IGNORE nodes, so a registered surface with an IGNORE anywhere on
      its ancestor chain — a common click-through pattern for decorative backdrops — could
      never be matched. (F) register() takes a generic Node, and the whole of mechanism 14
      plus the ancestor-chain test only mean anything for Control; a BOARD_TILE implemented
