  - purpose: affinity_can_write_rejection_query
    status: active
    api: "can_write(pair, source) -> WriteRejection (NONE means writable). Reachable values are exactly {NONE, INVALID_PAIR, INVALID_SOURCE, DEAD_PAIR_COMBAT_CARD_FORBIDDEN}; the other three are documented as structurally unreachable."
    not: "can_write(pair, source) -> bool"
    adr: docs/architecture/adr-0002-affinity-data-pool-data-structure-and-concurrency-contract.md
    reason: >
      Mechanism 9's TR-affinity-023 ruling was never registered here at all (found
      2026-08-21) — this entry registers it for the first time, carrying the new signature.
      bool has nowhere to express "the ordinal argument is itself illegal", which the
      ordinal-validation decision requires. THREE OF SEVEN VALUES ARE UNREACHABLE:
      SERIALIZATION_WINDOW_ACTIVE by semantic exclusion (transient state, not this
      predicate's purpose), and ZERO_AMPLITUDE / NON_FINITE_AMPLITUDE structurally because
      can_write has NO m parameter. Both Step 5.5 tracks independently flagged that the
      first draft excluded only one of the three — reusing an enum with silent dead values
      is the same shape as R7E-5, which this same revision was closing.
    referenced_by:
      - docs/architecture/adr-0002-affinity-data-pool-data-structure-and-concurrency-contract.md
    added: "2026-08-21"
    revised: ""

  - purpose: reclaimed_token_fifo_capacity
    status: active
    api: "_reclaimed_tokens is a fixed-capacity FIFO: RECLAIMED_TOKEN_CAPACITY = 64, owned by ADR-0002, paired with a private _reclaimed_token_order: Array[int] that maintains insertion order explicitly. No time threshold; no reference to TOKEN_TIMEOUT_MS."
    not: "RECLAIMED_TOKEN_TTL_MS >= 2 x TOKEN_TIMEOUT_MS; or relying on Dictionary iteration order to find the oldest entry"
    adr: docs/architecture/adr-0002-affinity-data-pool-data-structure-and-concurrency-contract.md
    reason: >
      Mechanism 7 originally deferred this constant with wording IDENTICAL to the one that
      made TOKEN_TIMEOUT_MS an orphan for three review rounds (C1). A first draft proposed a
      ratio rule; Step 5.5 rejected it — the derivation contradicted itself (claimed to need
      nothing from ADR-0004 while multiplying an ADR-0004-owned constant) and ADR-0004 has
      zero mentions of it, i.e. the C7 shape again. WHY A SECOND CONTAINER IS REQUIRED:
      (i) Dictionary has no O(1) dequeue; (ii) using .keys() order needs
      insertion-order-preservation, which NO probe has covered, and .keys() reallocates on
      every call; (iii) DECISIVE — the moment a token enters _reclaimed_tokens is when a
      sweep noticed it, which does NOT track token-id order (a long-running early token can
      be swept later than a short-lived later one), so "approximate oldest by key value"
      also fails. An explicit order array makes correctness independent of the unverified
      Dictionary ordering — the same technique mechanism 7 uses for the unverified Mutex
      reentrancy question, which round 7 called this project's best example of handling
      unverified engine behaviour. 64 = one order of magnitude above the single-digit bound
      mechanism 7 already establishes for concurrent non-atomic windows. OVERFLOW IS BENIGN
      AND EXPLICIT: the oldest reclaimed id is evicted, so end_non_atomic_window() returns
      INVALID_TOKEN instead of TIMED_OUT_RECLAIMED — diagnostic precision drops, data
      correctness does not. NOT a pure simplification: it TRADES the time-sweep path for an
      ordering container. Array.pop_front() complexity is unverified (presumed O(n)); with a
      fixed small constant this ADR claims only "amortised constant within a constant bound",
      never O(1).
    referenced_by:
      - docs/architecture/adr-0002-affinity-data-pool-data-structure-and-concurrency-contract.md
    added: "2026-08-21"
    revised: ""

  - purpose: cursor_process_priority_before_add_child
    status: active
    api: "process_priority must be assigned BEFORE add_child(), at all 5 add_child() call sites in ADR-0005. Enforced by a static source-order review item in Validation Criteria 9c."
    not: "add_child() first, then set process_priority"
    adr: docs/architecture/adr-0005-cursor-device-authority-input-architecture.md
    reason: >
      A node not yet in the scene tree cannot trigger any processing-chain reorder; setting the
      value after entry does trigger one, and whether that affects the frame's already-started
      traversal is UNVERIFIED engine behaviour for this project. Setting the value first costs
      ZERO, so it is mandated rather than recommended — this removes an impression-level engine
      dependency outright instead of carrying a Verification Required item for it. Round 5 raised
      this explicitly and the third revision NEITHER adopted NOR rejected it (R6-12): all five
      add_child() mentions were silent on ordering and VC 9c only asserted static values and
      parent-child relationships. Same pattern as S-2, except this time it was round 5's own
      recommendation that the next revision dropped.
    referenced_by:
      - docs/architecture/adr-0005-cursor-device-authority-input-architecture.md
    added: "2026-08-21"
    revised: ""
