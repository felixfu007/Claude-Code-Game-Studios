  - {id: TR-save-002, system: save-system, gdd: design/gdd/save-system.md, requirement: "型別白名單須在任何實例化之前完成閘控;範圍(扁平聯集vs依版本分域)未定案", created: 2026-08-18, revised: "", status: active}
  - {id: TR-save-003, system: save-system, gdd: design/gdd/save-system.md, requirement: "manifest加版本化區塊結構,每區塊各自版本化,manifest攜帶單一單調遞增規則集版本號", created: 2026-08-18, revised: "", status: active}
  - {id: TR-save-004, system: save-system, gdd: design/gdd/save-system.md, requirement: "每槽多檔案佈局:.dat/.bak/.prev.bak/.pre_migration.bak/.tmp,槽與槽完全隔離", created: 2026-08-18, revised: "", status: active}
  - {id: TR-save-005, system: save-system, gdd: design/gdd/save-system.md, requirement: "一般寫入路徑為同步阻塞單執行緒,狀態provisional且已逾越自訂解決期限(主機平台早已定案)", created: 2026-08-18, revised: "", status: active}
  - {id: TR-save-006, system: save-system, gdd: design/gdd/save-system.md, requirement: "遷移模型獨立決定:分步執行,每次一個版本躍遷,仍為單執行緒", created: 2026-08-18, revised: "", status: active}
  - {id: TR-save-007, system: save-system, gdd: design/gdd/save-system.md, requirement: "同槽重入不變量:拒絕同槽第二個並行呼叫並回傳處理中;逐槽進行中標記須無條件釋放", created: 2026-08-18, revised: "", status: active}
  - {id: TR-save-008, system: save-system, gdd: design/gdd/save-system.md, requirement: "跨系統權杖式序列化生命週期介面(消費自好感度數值池),涵蓋4條終止路徑各自保證", created: 2026-08-18, revised: "", status: active}
  - {id: TR-save-009, system: save-system, gdd: design/gdd/save-system.md, requirement: "路徑四強保證僅在I/O失敗以回傳碼(而非未分類例外)回報時成立", created: 2026-08-18, revised: "", status: active}
  - {id: TR-save-010, system: save-system, gdd: design/gdd/save-system.md, requirement: "結構化機器可讀的結果須能區分成功/4類拒絕代碼/無資料/槽處理中/遷移成功但回寫失敗", created: 2026-08-18, revised: "", status: active}
  - {id: TR-save-011, system: save-system, gdd: design/gdd/save-system.md, requirement: "完整讀取路徑檢查順序已鎖定:完整性→版本→型別白名單→語意驗證/遷移", created: 2026-08-18, revised: "", status: active}
  - {id: TR-save-012, system: save-system, gdd: design/gdd/save-system.md, requirement: "雙讀取路徑成本輪廓不同:manifest-only(不觸發遷移,豁免重入拒絕)vs完整讀取(觸發遷移,僅限非互動)", created: 2026-08-18, revised: "", status: active}
  - {id: TR-save-013, system: save-system, gdd: design/gdd/save-system.md, requirement: "兩層加密雜湊鏈(逐區塊加頂層),固定規範順序,與寫入當下容器順序無關", created: 2026-08-18, revised: "", status: active}
  - {id: TR-save-014, system: save-system, gdd: design/gdd/save-system.md, requirement: "雜湊輸入須為寫入前、同一次序列化操作產生的記憶體資料,絕不可是寫入後讀回的位元組", created: 2026-08-18, revised: "", status: active}
  - {id: TR-save-015, system: save-system, gdd: design/gdd/save-system.md, requirement: "每一次寫入/flush/rename/刪除呼叫的成功與否須被實際檢查;flush()可檢查性在4.7.1未經確認", created: 2026-08-18, revised: "", status: active}
  - {id: TR-save-016, system: save-system, gdd: design/gdd/save-system.md, requirement: "跨平台原子置換是已鎖定的六步驟行為序列,不留架構階段自由裁量", created: 2026-08-18, revised: "", status: active}
  - {id: TR-save-017, system: save-system, gdd: design/gdd/save-system.md, requirement: "讀取端回復規則須採精確檔名比對,絕不可用萬用字元/前綴比對", created: 2026-08-18, revised: "", status: active}
  - {id: TR-save-018, system: save-system, gdd: design/gdd/save-system.md, requirement: "遭拒存檔的唯讀存取入口,依命中的備份層級分三級告知誠實程度", created: 2026-08-18, revised: "", status: active}
  - {id: TR-save-019, system: save-system, gdd: design/gdd/save-system.md, requirement: "耐久性邊界:flush僅指引擎緩衝區沖刷,非硬體層級落盤;真正斷電耐久性可能需要GDExtension", created: 2026-08-18, revised: "", status: active}
  - {id: TR-save-020, system: save-system, gdd: design/gdd/save-system.md, requirement: "存檔位置須在user://,.tmp與目標檔須位於同一檔案系統(rename原子性前提)", created: 2026-08-18, revised: "", status: active}
  - {id: TR-save-021, system: save-system, gdd: design/gdd/save-system.md, requirement: "遷移函數須為純函數、O(該區塊自身筆數);後置條件檢查須逐步驟執行", created: 2026-08-18, revised: "", status: active}
  - {id: TR-save-022, system: save-system, gdd: design/gdd/save-system.md, requirement: "語意驗證器為fail-closed:manifest列出無對應驗證器宣告的區塊本身即視為DATA_CORRUPTED", created: 2026-08-18, revised: "", status: active}
  - {id: TR-save-023, system: save-system, gdd: design/gdd/save-system.md, requirement: "持久化的enum一律以字串名稱加對照表表示;退役名稱永久保留,須有CI可強制的重用檢查", created: 2026-08-18, revised: "", status: active}
  - {id: TR-save-024, system: save-system, gdd: design/gdd/save-system.md, requirement: "遷移完成標記的寫入責任分散於3種寫入路徑類型;須被涵蓋於頂層雜湊輸入", created: 2026-08-18, revised: "", status: active}
  - {id: TR-save-025, system: save-system, gdd: design/gdd/save-system.md, requirement: "可觀測性介面分兩類:診斷用(僅QA)vs生產用(進度查詢,豁免重入拒絕)", created: 2026-08-18, revised: "", status: active}
  - {id: TR-save-026, system: save-system, gdd: design/gdd/save-system.md, requirement: "效能量測儀器化:三桶一般寫入耗時、六桶遷移讀取耗時、加性下限成本模型、無界重跑鏈風險", created: 2026-08-18, revised: "", status: active}
  - {id: TR-save-027, system: save-system, gdd: design/gdd/save-system.md, requirement: "重複回寫失敗計數逐槽獨立、不持久化,於成功回寫或槽被覆寫時歸零", created: 2026-08-18, revised: "", status: active}
  - {id: TR-save-028, system: save-system, gdd: design/gdd/save-system.md, requirement: "巢狀Resource深層複製紀律需要duplicate_deep(DEEP_DUPLICATE_ALL)——確切enum名稱未經查證", created: 2026-08-18, revised: "", status: active}
  - {id: TR-save-029, system: save-system, gdd: design/gdd/save-system.md, requirement: "維運層級重跑須以創世存底重跑加append-only拼接方式和解,重用標準寫入管線", created: 2026-08-18, revised: "", status: active}
  - {id: TR-save-030, system: save-system, gdd: design/gdd/save-system.md, requirement: "雲端存檔同步(Steam Cloud)與多檔案原子性的互動未定義", created: 2026-08-18, revised: "", status: active}

  # ─── 單一游標/高亮狀態系統 (cursor-highlight-state.md) ───────────────────────
  - {id: TR-cursor-001, system: cursor-highlight-state, gdd: design/gdd/cursor-highlight-state.md, requirement: "全域狀態恰為3個已認定的頂層欄位;擁有節點生命週期須涵蓋所有使用本系統的畫面", created: 2026-08-18, revised: "", status: active}
  - {id: TR-cursor-002, system: cursor-highlight-state, gdd: design/gdd/cursor-highlight-state.md, requirement: "表面類型標籤須為單一集中定義的共用enum;實作位置與擁有者未定案", created: 2026-08-18, revised: "", status: active}
  - {id: TR-cursor-003, system: cursor-highlight-state, gdd: design/gdd/cursor-highlight-state.md, requirement: "同一標籤在任一時刻至多一個掛載實例;需要一個註冊/發現機制", created: 2026-08-18, revised: "", status: active}
  - {id: TR-cursor-004, system: cursor-highlight-state, gdd: design/gdd/cursor-highlight-state.md, requirement: "裝置權威分類須依原始InputEvent子類別,絕不可讀取.device/裝置ID", created: 2026-08-18, revised: "", status: active}
  - {id: TR-cursor-005, system: cursor-highlight-state, gdd: design/gdd/cursor-highlight-state.md, requirement: "Input Map約束:除非語意上為懸停/游標移動,ui_* action不得綁定滑鼠輸入", created: 2026-08-18, revised: "", status: active}
  - {id: TR-cursor-006, system: cursor-highlight-state, gdd: design/gdd/cursor-highlight-state.md, requirement: "須緩衝整幀InputEvent並在收集完成後才裁決;須掛在_input(),絕不可用_unhandled_input()", created: 2026-08-18, revised: "", status: active}
  - {id: TR-cursor-007, system: cursor-highlight-state, gdd: design/gdd/cursor-highlight-state.md, requirement: "專案層級Agile Event Flushing必須保持關閉——整個一幀一批次假設依賴於此", created: 2026-08-18, revised: "", status: active}
  - {id: TR-cursor-008, system: cursor-highlight-state, gdd: design/gdd/cursor-highlight-state.md, requirement: "四個行為者的決定性同幀執行順序;需要具體的process_priority數值", created: 2026-08-18, revised: "", status: active}
  - {id: TR-cursor-009, system: cursor-highlight-state, gdd: design/gdd/cursor-highlight-state.md, requirement: "滑鼠奪權門檻數學:逐表面類型像素常數、淨位移非路徑總和、根視窗座標空間", created: 2026-08-18, revised: "", status: active}
  - {id: TR-cursor-010, system: cursor-highlight-state, gdd: design/gdd/cursor-highlight-state.md, requirement: "累積器須依裝置權威加OS焦點閘控;須掛NOTIFICATION_APPLICATION_FOCUS_*", created: 2026-08-18, revised: "", status: active}
  - {id: TR-cursor-011, system: cursor-highlight-state, gdd: design/gdd/cursor-highlight-state.md, requirement: "已知確認、尚未修復的永久鎖死缺陷(持續按住方向輸入);已降級為建議項但架構層面仍未解決", created: 2026-08-18, revised: "", status: active}
  - {id: TR-cursor-012, system: cursor-highlight-state, gdd: design/gdd/cursor-highlight-state.md, requirement: "寫入介面設定新目標:雙輸入簽章,不含碰撞箱幾何,自動清除有效性旗標", created: 2026-08-18, revised: "", status: active}
  - {id: TR-cursor-013, system: cursor-highlight-state, gdd: design/gdd/cursor-highlight-state.md, requirement: "寫入介面標記待重新解析:須回傳結構化的已套用/已過期結果,絕不靜默", created: 2026-08-18, revised: "", status: active}
  - {id: TR-cursor-014, system: cursor-highlight-state, gdd: design/gdd/cursor-highlight-state.md, requirement: "讀取介面:有效性旗標查詢加裝置權威查詢,兩者拒絕回饋須可區分", created: 2026-08-18, revised: "", status: active}
  - {id: TR-cursor-015, system: cursor-highlight-state, gdd: design/gdd/cursor-highlight-state.md, requirement: "卸載前目標交接義務,涵蓋存檔讀取整批替換的三個分支", created: 2026-08-18, revised: "", status: active}
  - {id: TR-cursor-016, system: cursor-highlight-state, gdd: design/gdd/cursor-highlight-state.md, requirement: "全域每裝置待機指示元件須存在於每個畫面;現有候選擁有者皆為畫面範圍、無一符合", created: 2026-08-18, revised: "2026-09-03: 管理者裁決取消此需求本身（非重新措辭）——滑鼠奪權漸進回饋與鍵盤/手把即時奪權已提供等效的裝置變動可觀察回饋，待機指示是重複的第二條回饋管道。依據見 production/session-state/active.md「2026-09-03 第三十二批」。ADR-0005 機制十二已改為服務機制十三/十三之二，不再回應本 TR。", status: deprecated}
  - {id: TR-cursor-017, system: cursor-highlight-state, gdd: design/gdd/cursor-highlight-state.md, requirement: "原生游標須在權威非滑鼠時隱藏,唯一例外是連續漸變的奪權回饋——連續透明度動畫在4.7.1可能不受支援", created: 2026-08-18, revised: "", status: active}
  - {id: TR-cursor-018, system: cursor-highlight-state, gdd: design/gdd/cursor-highlight-state.md, requirement: "全鍵盤/手把平權;已註冊表面不得使用原生Control焦點/懸停主題(4.6雙焦點分離)", created: 2026-08-18, revised: "", status: active}
  - {id: TR-cursor-019, system: cursor-highlight-state, gdd: design/gdd/cursor-highlight-state.md, requirement: "交接視覺延遲硬性上限(最多1幀)與奪權收斂上限,皆需要幀精準量測機制", created: 2026-08-18, revised: "", status: active}

  # ─── game-concept.md (跨系統) ─────────────────────────────────────────
  - {id: TR-concept-001, system: game-concept, gdd: design/gdd/game-concept.md, requirement: "活棋盤場景架構模型未定案:原地替換規則資料vs整場切換場景", created: 2026-08-18, revised: "", status: active}
  - {id: TR-concept-002, system: game-concept, gdd: design/gdd/game-concept.md, requirement: "存檔格式須從初始設計就內建跨規則集版本遷移能力", created: 2026-08-18, revised: "", status: active}
  - {id: TR-concept-003, system: game-concept, gdd: design/gdd/game-concept.md, requirement: "若地形資料採Resource子類別,深層複製紀律須與存檔格式一併設計", created: 2026-08-18, revised: "", status: active}
  - {id: TR-concept-004, system: game-concept, gdd: design/gdd/game-concept.md, requirement: "即時預覽重算範圍已鎖定:逐格候選預覽O(n),全盤O(n^2)重算僅於落子確定時執行一次", created: 2026-08-18, revised: "", status: active}
  - {id: TR-concept-005, system: game-concept, gdd: design/gdd/game-concept.md, requirement: "棋盤格高亮不得依賴原生Control焦點/懸停主題;單一游標格狀態源一般化至所有UI表面", created: 2026-08-18, revised: "", status: active}
  - {id: TR-concept-006, system: game-concept, gdd: design/gdd/game-concept.md, requirement: "裝置權威為兩層機制:ui_* action為權威閘門,原始InputEvent子類別做裝置分類", created: 2026-08-18, revised: "", status: active}
  - {id: TR-concept-007, system: game-concept, gdd: design/gdd/game-concept.md, requirement: "初始游標狀態需要呼叫方注入初始落點的介面,不由游標系統自行決定", created: 2026-08-18, revised: "", status: active}
  - {id: TR-concept-008, system: game-concept, gdd: design/gdd/game-concept.md, requirement: "4.7 shader前處理器限制收緊,可能影響好感度連線發光效果", created: 2026-08-18, revised: "", status: active}
  - {id: TR-concept-009, system: game-concept, gdd: design/gdd/game-concept.md, requirement: "MVP驗收協議1需要正式的預判標記狀態加遙測管道,比對標記與實際結算結果", created: 2026-08-18, revised: "", status: active}
  - {id: TR-concept-010, system: game-concept, gdd: design/gdd/game-concept.md, requirement: "MVP驗收協議2/5需要逐回合可序列化的具名存活單位鄰接圖快照", created: 2026-08-18, revised: "", status: active}
  - {id: TR-concept-011, system: game-concept, gdd: design/gdd/game-concept.md, requirement: "5張手工MVP關卡需要一套工具鏈量測4項空間指標,且須能在地形演變後重跑", created: 2026-08-18, revised: "", status: active}
  - {id: TR-concept-012, system: game-concept, gdd: design/gdd/game-concept.md, requirement: "專案級forbidden pattern:禁止連線功能、禁止程序化地形生成", created: 2026-08-18, revised: "", status: active}
  - {id: TR-concept-013, system: game-concept, gdd: design/gdd/game-concept.md, requirement: "戰鬥結算需要可查詢的淨聯動總分聚合值,要求決定性、可重現的結算以支援A/B對照", created: 2026-08-18, revised: "", status: active}
  - {id: TR-concept-014, system: game-concept, gdd: design/gdd/game-concept.md, requirement: "專案級forbidden pattern:戰鬥結算路徑絕不可使用RNG", created: 2026-08-18, revised: "", status: active}

