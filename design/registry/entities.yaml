# ─── CONSTANTS ───────────────────────────────────────────────────────────────
# Named numerical values referenced across multiple systems.
# Register a constant when it is defined in one GDD but another GDD must
# agree with it (e.g., gold carry limit defined in economy but checked in
# inventory, or base inventory slots defined in inventory but displayed in HUD).
#
# Required fields: name, status, source, referenced_by, value, unit, added

constants:
  - name: enemy_advantage_pct
    status: active
    source: design/gdd/tactical-combat-system.md
    referenced_by:
      - design/gdd/tactical-combat-system.md
      - design/gdd/affinity-position-chain.md   # #5 — 硬性交叉校準義務,不得獨立調整
    value: 0.20
    unit: ratio
    notes: "安全範圍 [0, 1.0)。與 #5 的 Φ_max 強耦合 — 兩者必須滿足『Φ 可提供的
      實際加成 ≥ 本值造成的數值差』,否則「以弱勝強」機制錨點失效。定義與校準
      義務見 tactical-combat-system.md Tuning Knobs #1 與「跨系統校準義務」。"
    added: 2026-08-17
    revised: ""

  - name: base_mp
    status: active
    source: design/gdd/tactical-combat-system.md
    referenced_by:
      - design/gdd/tactical-combat-system.md
      - design/gdd/skill-card-system.md    # #6 — 「額外移動力」類卡牌效果須與此對齊
    value: 4
    unit: tiles
    notes: "安全範圍 [3, 6]。見 tactical-combat-system.md Tuning Knobs #3。#6 的
      額外移動力效果在雙旗標行動經濟下語意待定 — 見該 GDD OQ-4。"
    added: 2026-08-17
    revised: ""

  - name: terrain_cost
    status: active
    source: design/gdd/tactical-combat-system.md
    referenced_by:
      - design/gdd/tactical-combat-system.md
      - design/gdd/living-board-terrain.md  # #14 — 地形演變須產出符合本階層的資料
    value: "平地 1 / 森林 2 / 山地 3"
    unit: mp_per_tile
    notes: "三階,硬性下限 ≥1(資料寫入時驗證)。目前無「不可通行」層級 — 見
      tactical-combat-system.md OQ-10(此為阻擋關卡設計的待決項)。定義見該 GDD
      Tuning Knobs #4。"
    added: 2026-08-17
    revised: ""

  - name: max_occlusion_ratio
    status: active
    source: design/gdd/tactical-combat-system.md
    referenced_by:
      - design/gdd/tactical-combat-system.md
    value: 0.25
    unit: ratio
    notes: "安全範圍 [0, 0.5]。對關卡設計的硬性約束:單一戰場中標記為遮蔽的格子
      佔比上限。定義見 tactical-combat-system.md Tuning Knobs #5。"
    added: 2026-08-17
    revised: ""

  - name: weapon_range_tiers
    status: active
    source: design/gdd/tactical-combat-system.md
    referenced_by:
