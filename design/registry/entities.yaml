      - design/gdd/combat-hud.md      # #10 — 須渲染三層射程疊加圖
      - design/gdd/tutorial-system.md # #12 — 須教過遠程近身盲區
    value: "近戰 (1,1) / 中程 (1,2) / 遠程 (2,4)"
