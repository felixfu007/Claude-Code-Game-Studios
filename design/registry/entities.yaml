  - name: phi_max
    status: active
    source: design/gdd/affinity-position-chain.md
    referenced_by:
      - design/gdd/affinity-position-chain.md
      - design/gdd/tactical-combat-system.md   # 公式一的 Φ 上界,OQ-1 待此值收斂
    value: 12
    unit: damage_points
    notes: "Φ 的硬性夾限上界,值為 12。🔴 2026-09-01 稽核改寫推導語言(數值不變):
      本欄原寫『等於 N=4(**每角色關係線上限**)在 amp=1 下的理論邊界』—— 那個上限已被
      來源 GDD 撤銷(見本表 affinity_links_per_character_max 條目,status: retracted)。
      **正確的推導依據是幾何事實,不是關係線上限**:曼哈頓距離恰為 1 的格子只有 4 個
      (棋盤為正交四鄰),故同時享有『緊鄰』加成的線最多 4 條,4×(+3) = 12。
