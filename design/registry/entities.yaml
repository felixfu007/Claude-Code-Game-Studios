# Game World Entity Registry
#
# PURPOSE: Single source of truth for all named game-world facts that appear
# in more than one document. Skills check this before writing new content to
# detect cross-doc inconsistencies at authoring time.
#
# RULES:
#   - Only register facts that cross system boundaries. Internal-only facts
#     (a formula used in one GDD only) do NOT need to be registered.
#   - Never delete entries — set status: deprecated instead.
#   - When a value changes: update the value, set revised: to today's date,
#     and add a comment with the old value and which GDD changed it.
#   - source: is the authoritative GDD — the one that "owns" this fact.
#     Other GDDs that reference it list themselves in referenced_by.
#   - When a new GDD references an existing entry, append its path to
#     referenced_by. Do not create a duplicate entry.
#
# WRITTEN BY: /design-system (Phase 5 — after GDD sections are approved)
#             /consistency-check (when resolving conflicts)
# READ BY:    /design-system (Phase 2 — before authoring begins, and after
#               Section C/D writes to conflict-check new entities/formulas)
#             /consistency-check (primary input — grep-first, GDD-second)
#             /review-all-gdds (Phase 1 — baseline for Phase 2 checks)
#             /architecture-review (data structure and interface validation)
#
# SEARCH PATTERNS (for skills using Grep):
#   All entity names:        Grep pattern="^  - name:" path="design/registry/entities.yaml"
#   Specific entity:         Grep pattern="  - name: goblin" path="design/registry/entities.yaml"
#   All items:               Grep pattern="^  - name:" path="design/registry/entities.yaml" (items section)
#   What combat.md owns:     Grep pattern="source: design/gdd/combat.md"
#   What inventory.md uses:  Grep pattern="referenced_by.*inventory"
#   All gold values:          Grep pattern="value_gold:"
#   Deprecated entries:      Grep pattern="status: deprecated"
#
# FORMAT: YAML. Consistent indentation is critical for grep reliability.
#   Sections: entities | items | formulas | constants
#   Each entry: name, status, source, referenced_by[], attributes{}, added, revised

version: 1
last_updated: "2026-08-31"

# ─── ENTITIES ────────────────────────────────────────────────────────────────
# Named game-world objects: enemies, NPCs, characters, factions, bosses.
# Register an entity here when it appears in more than one GDD — e.g., an
# enemy defined in combat.md that also drops items listed in inventory.md.
#
# Required fields: name, status, source, referenced_by, added
# Attribute fields: any key stats that could appear in another GDD
#   (health, damage, drops, faction, etc.)

entities: []

# Example (remove when first real entry is added):
#
# entities:
#   - name: goblin
#     status: active              # active | deprecated
#     source: design/gdd/combat.md
#     referenced_by:
#       - design/gdd/combat.md
#       - design/gdd/inventory.md
#     health: 40
#     damage: 8
#     drops:
#       - item: goblin_arm        # must match an entry in items section
#         qty: 1
#         drop_rate: 0.8          # 0.0–1.0
#     added: 2026-03-26
#     revised: ""


# ─── ITEMS ───────────────────────────────────────────────────────────────────
# Named collectables, equipment, consumables, crafting materials, currency.
# Register an item when its name or value appears in more than one GDD.
#
# Required fields: name, status, source, referenced_by, added
# Attribute fields: value_gold, weight, stackable, category, and any stat
#   modifiers that another system (e.g., economy, crafting) might reference.

items: []

# Example:
#
# items:
#   - name: goblin_arm
#     status: active
#     source: design/gdd/combat.md   # drop defined in combat GDD
#     referenced_by:
#       - design/gdd/combat.md
#       - design/gdd/inventory.md    # inventory GDD lists its weight/stack rules
#       - design/gdd/economy.md      # economy GDD references its sell price
#     value_gold: 5
#     weight: 1
#     stackable: true
#     category: crafting_material
#     added: 2026-03-26
#     revised: ""


# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas:
  - name: combat_strength_read
    status: active
    source: design/gdd/affinity-data-pool.md
    referenced_by:
      - design/gdd/affinity-data-pool.md
      - design/gdd/game-concept.md   # 獨特賣點「敘事可達性硬性約束」references it by name
    variables:
      - p
      - t_query
      - t_now
      - m_i
      - t_i
      - lambda_combat
    output_range: [unbounded, unbounded]
    expression: "combat_strength_read(p, t_query=t_now) = Σ (m_i · λ_combat^(t_query − t_i)), over records with t_i ≤ t_query"
    notes: "Recency-weighted signed sum over the global Delta Log for pair p, all
      sources weighted 1.0 (source-insensitive — see AC-11). Feeds
      affinity-position bonus/penalty calc. Bounded in practice for λ_combat<1
      via convergent geometric series; unbounded only at the legal edge case
      λ_combat=1. Accepts an optional historical t_query parameter (defaults to
      t_now); age_i = t_query − t_i."
    added: 2026-07-30
    revised: "2026-08-09"

  - name: narrative_depth_read
    status: active
    source: design/gdd/affinity-data-pool.md
    referenced_by:
      - design/gdd/affinity-data-pool.md
      - design/gdd/game-concept.md    # 獨特賣點「敘事可達性硬性約束」references it by name
      - design/gdd/systems-index.md   # Cross-System Obligations Registry row citing it by name
    variables:
      - p
      - t_query
      - t_now
      - m_i
      - t_i
      - lambda_narrative
      - alpha
      - source_i
    output_range: [unbounded, unbounded]
    expression: "narrative_depth_read(p, t_query=t_now) = Σ (w(source_i) · m_i · λ_narrative^(t_query − t_i)), w=α for combat_card, w=1 otherwise, over records with t_i ≤ t_query"
    notes: "Recency-weighted, source-discounted sum over the global Delta Log for
      pair p. Feeds support-conversation unlock and ending-branch determination.
      α∈(0,1) open interval per round-7 creative-director ruling (2026-07-30) —
      weakly couples combat-optimal play to narrative outcome without fully
      binding them. CORRECTION (2026-08-09, per affinity-data-pool.md Formulas
      公式二 output-range note, round-2 /design-review): the per-item bound
      |w(source_i)·m_i·λ^age| ≤ |m_i·λ^age| does NOT generalize to
      |narrative_depth_read| ≤ |combat_strength_read| overall — when records of
      opposite sign are discounted unevenly, the discount can WEAKEN
      cancellation and make the discounted sum larger in absolute value than the
      full-weight sum (documented counterexample: same-age m=+10 combat_card
      (α=0.3) and m=−10 support_conversation (w=1.0) → full-weight sum = 0,
      discounted sum = −7, |−7| > |0|). This registry entry previously asserted
      the disproven inequality; removed."
    added: 2026-07-30
    revised: "2026-08-09"

  - name: shape_feature_read
    status: active
    source: design/gdd/affinity-data-pool.md
    referenced_by:
      - design/gdd/affinity-data-pool.md
    variables:
      - p
      - t_query
      - reversal_count
      - source_distribution
      - time_distribution
      - source_polarity
      - total_churn
      - segment_profile
      - source_absence
      - low_confidence
      - c_now
    output_range: ["n/a — see sub-features", "n/a — see sub-features"]
    notes: "Computed on the FULL UNWEIGHTED log for pair p (records with
      t_i ≤ t_query) — no λ, no α. SEVEN sub-features as of round 5-7
      /design-review (this entry previously listed only 3 — corrected
      2026-08-09): 3a reversal_count (int, 0 to n(p)-1); 3b source_distribution
      (raw counts n_cc/n_sc/n_se plus proportions p_cc/p_sc/p_se — raw counts
      required alongside proportions to distinguish 'no data yet' from
      'deliberate absence', per round-6 'absence as positive-weight shape
      feature' requirement); 3c time_distribution (span_c, spread_ratio —
      denominator is the campaign-tick counter c_now, NOT the global write
      counter t_now; this entry previously said 'span_t', which was the
      pre-round-1 design superseded for spread_ratio instability reasons); 3d
      source_polarity (net_cc/net_sc/net_se, signed sums per source); 3e
      total_churn (Σ|m_i|, optionally split per source); 3f segment_profile
      (Q equal-width campaign-tick segments of [c_i_min,c_i_max], each with
      count_k/net_k/churn_k — carries a low_confidence flag); 3g source_absence
      (per-source three-state: active/absent_pending/absent_confirmed, gated on
      c_now vs Tuning Knob M). n(p, t_query)=0 returns an explicit sentinel
      (null), not 0, for time_distribution and segment_profile;
      source_absence is the one sub-feature that does NOT sentinel on
      n(p)=0 (still computes active/absent_pending/absent_confirmed from
      c_now vs M)."
    added: 2026-07-30
    revised: "2026-08-09"

  - name: predictive_read
    status: active
    source: design/gdd/affinity-data-pool.md
    referenced_by:
      - design/gdd/affinity-data-pool.md
    variables:
      - p
      - t_query
      - t_last
      - w_new
      - m_new
      - t_new
      - lambda
    output_range: [unbounded, unbounded]
    expression: "read(t_query) = λ^(t_query − t_last) · read(t_last) + Σ (w_new · m_new · λ^(t_query − t_new)) — this is 公式四 (Formula 4) in affinity-data-pool.md, the predictive/hypothetical read"
    notes: "NEW (2026-08-09, previously entirely unregistered). Recursive
      closed-form rewrite of formula 一/二 that supports 'what-if' queries for
      the game-concept.md-mandated '預判模式' (prediction mode) feature —
      evaluates the read value AS IF one or more hypothetical, not-yet-written
      records existed, without actually writing them (pure function, no side
      effects). t_last is the pair's most recent actually-written record's
      t_i (or := t_query when n(p)=0, to avoid NaN). Multiple hypothetical
      records in one call must be assigned strictly increasing virtual t_new
      values, not shared. This is the ONLY caller-facing exemption to the
      't_query must not exceed t_now' rule — formulas 一/二/三 remain strictly
      bound by that rule. Requires at least one hypothetical record per call
      (a zero-hypothetical call is rejected as invalid input, not routed
      here)."
    added: 2026-08-09
    revised: 2026-08-10

  - name: damage_formula
    status: active
    source: design/gdd/tactical-combat-system.md
    referenced_by:
      - design/gdd/tactical-combat-system.md
      - design/gdd/affinity-position-chain.md   # #5 尚未設計 — 其 Φ 輸出為本公式輸入
    variables:
      - ATK
      - DEF
      - Phi
    output_range: [0, unbounded]
    expression: "max(0, ATK − DEF + Φ)"
    notes: "定義見 tactical-combat-system.md Formulas 公式一。零隨機:無命中/爆擊
      判定。下界硬夾 0(無最低傷害地板)。上界待 #5 聲明 Φ_max 後才能收斂 —
      見該 GDD Open Questions OQ-1。"
    added: 2026-08-17
    revised: ""

  - name: enemy_stat_scaling
    status: active
    source: design/gdd/tactical-combat-system.md
    referenced_by:
      - design/gdd/tactical-combat-system.md
    variables:
      - player_baseline_stat
      - enemy_advantage_pct
    output_range: [0, unbounded]
    expression: "ceil(player_baseline_stat × (1 + enemy_advantage_pct))"
    notes: "定義見 tactical-combat-system.md Formulas 公式二。無條件進位,非四捨
      五入(round 會在小基準值靜默吃掉優勢)。輸入 player_baseline_stat 目前
      無擁有 GDD — 見該 GDD Open Questions OQ-2,此公式在該項解決前無法實作。"
    added: 2026-08-17
    revised: ""

  - name: reachable_tile_formula
    status: active
    source: design/gdd/tactical-combat-system.md
    referenced_by:
      - design/gdd/tactical-combat-system.md
      - design/gdd/combat-hud.md           # #10 尚未設計 — 讀取本公式輸出以渲染移動範圍
      - design/gdd/living-board-terrain.md # #14 尚未設計 — 其地形變化須符合 terrain_cost 結構
    variables:
      - origin
      - MP
      - terrain_cost
      - occupied
      - ignore_occupancy
    output_range: [1, grid_tile_count]   # 集合基數;恆非空(至少含 origin)
    expression: "{ t ∈ Grid : accumulated_cost(origin,t) ≤ MP(u) ∧ occupied(t) = false }"
    notes: "定義見 tactical-combat-system.md Formulas 公式三。occupied() 不含查詢
      單位自身。ignore_occupancy=true 僅供 UI 標示不可達成因,不得作為移動合法性
      依據(見該 GDD AC-14)。"
    added: 2026-08-17
    revised: ""

  - name: threat_range_formula
    status: active
    source: design/gdd/tactical-combat-system.md
    referenced_by:
      - design/gdd/tactical-combat-system.md
      - design/gdd/combat-hud.md           # #10 尚未設計 — 讀取本公式輸出以渲染威脅範圍疊加圖
    variables:
      - reachable_set
      - min_range
      - max_range
    output_range: [0, grid_tile_count]   # 集合基數;可為空集合(理論邊界)
    expression: "{ t ∈ Grid : ∃ r ∈ reachable_set(e), manhattan_distance(r,t) ∈ [min_range(e), max_range(e)] }"
    notes: "定義見 tactical-combat-system.md Formulas 公式四(2026-08-17 第二輪
      /design-review 新增,回應 BLOCKING-NOW B-2)。刻意不檢查視線 — 寧可高估
      危險範圍也不要低估,理由見該 GDD 公式四『視線的刻意省略』段落。"
    added: 2026-08-17
    revised: ""

